<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BookingAlger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
</head>
<body>
<title>BookingAlger Tâches</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-style stack — splash, then a grouped list of apartments; tapping one pushes a detail screen. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#F7F9FA; --fg:#0E1B23; --fg-2:#566570; --fg-3:#8A96A0;
  --sep:rgba(14,27,35,.11); --fill:rgba(110,124,136,.13); --scrim:rgba(8,16,22,.38);
  --brand:#0F78A3; --on-brand:#FFFFFF; --brand-soft:#E2F0F6;
  --ok:#22693A; --ok-soft:#E3F1E7; --danger:#C2342B; --danger-soft:#FBE8E6; --warn:#9A5B00; --warn-soft:#FBF0DD;
  --nav:rgba(241,244,246,.82); --shadow:0 1px 2px rgba(14,27,35,.06),0 6px 24px rgba(14,27,35,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
  --r-lg:14px; --r-md:12px; --ease:cubic-bezier(.32,.72,0,1); --t-push:420ms;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#15191C; --surface-2:#1C2125; --fg:#F1F5F7; --fg-2:#A1ADB5; --fg-3:#6F7C85;
  --sep:rgba(255,255,255,.1); --fill:rgba(130,142,152,.22); --scrim:rgba(0,0,0,.6);
  --brand:#52B6DF; --on-brand:#03202C; --brand-soft:rgba(82,182,223,.16);
  --ok:#62C784; --ok-soft:rgba(98,199,132,.15); --danger:#FF6F62; --danger-soft:rgba(255,111,98,.16); --warn:#F2B04C; --warn-soft:rgba(242,176,76,.15);
  --nav:rgba(0,0,0,.78); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#15191C; --surface-2:#1C2125; --fg:#F1F5F7; --fg-2:#A1ADB5; --fg-3:#6F7C85;
  --sep:rgba(255,255,255,.1); --fill:rgba(130,142,152,.22); --scrim:rgba(0,0,0,.6);
  --brand:#52B6DF; --on-brand:#03202C; --brand-soft:rgba(82,182,223,.16);
  --ok:#62C784; --ok-soft:rgba(98,199,132,.15); --danger:#FF6F62; --danger-soft:rgba(255,111,98,.16); --warn:#F2B04C; --warn-soft:rgba(242,176,76,.15);
  --nav:rgba(0,0,0,.78); --shadow:none; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#splash img{width:min(74vw,340px);height:auto;animation:logoIn .9s var(--ease) both}
#splash .bar{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:44px;height:3px;border-radius:2px;background:#E6EEF2;overflow:hidden}
#splash .bar::after{content:"";display:block;height:100%;width:40%;background:#1A8CB6;border-radius:2px;animation:load 1.1s ease-in-out infinite}
#splash.out{opacity:0;visibility:hidden}
@keyframes logoIn{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* Views */
.view{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);-webkit-overflow-scrolling:touch}
#detail{transform:translateX(100%);transition:transform var(--t-push) var(--ease);z-index:5;box-shadow:-12px 0 40px rgba(0,0,0,.08);visibility:hidden}
#detail.open{transform:none;visibility:visible}
#home{transition:transform var(--t-push) var(--ease),filter var(--t-push)}
body.pushed #home{transform:translateX(-28%);filter:brightness(.92)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}

/* Nav bar */
.nav{position:sticky;top:0;z-index:4;padding-top:env(safe-area-inset-top,0px);background:transparent;transition:background .2s,box-shadow .2s}
.nav.solid{background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav-in{max-width:720px;margin:0 auto;height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-title{font-weight:600;font-size:17px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.nav.solid .nav-title{opacity:1;transform:none}
.nav-l{justify-self:start}.nav-r{justify-self:end;display:flex;gap:4px}
.nbtn{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:2px;color:var(--brand);border-radius:22px;font-size:17px;transition:opacity .15s}
.nbtn:active{opacity:.45}
.nbtn .ic{width:24px;height:24px}
.nbtn.back{padding-right:8px}.nbtn.back .ic{width:26px;height:26px;stroke-width:2.4}
.round{width:36px;min-width:36px;height:36px;margin:4px;background:var(--fill)}
.round .ic{width:20px;height:20px}

/* Large title */
.large{padding-block:2px 12px}
.brandline{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.brandline img{height:22px;width:auto}
.large h1{font:700 34px/1.12 var(--font-display);letter-spacing:-.022em;margin:0;text-wrap:balance}
.sub{color:var(--fg-2);font-size:15px;margin:6px 0 0}

/* Search + segmented */
.search{display:flex;align-items:center;gap:6px;height:38px;border-radius:10px;background:var(--fill);padding:0 10px;color:var(--fg-3);margin-top:14px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font-size:17px;height:100%}
.search input::placeholder{color:var(--fg-3)}
.search .ic{width:18px;height:18px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--fill);border-radius:10px;padding:2px;margin-top:12px;position:relative}
.seg button{position:relative;z-index:1;min-height:36px;border-radius:8px;font-size:13px;font-weight:500;color:var(--fg);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;transition:color .2s}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .pill{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/4);background:var(--surface);border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .32s var(--ease)}
.seg .n{font-variant-numeric:tabular-nums;color:var(--fg-2);font-weight:500}

/* Grouped list */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--fg-2);margin:26px 16px 7px}
.sec-h button{color:var(--brand);text-transform:none;letter-spacing:0;font-size:15px;min-height:44px;margin:-14px 0}
.group{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 12px 10px 12px;position:relative;transition:background .15s}
.row:active{background:var(--surface-2)}
.row+.row::before{content:"";position:absolute;top:0;left:84px;right:0;height:.5px;background:var(--sep)}
.thumb{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;background:var(--fill)}
.row-body{flex:1;min-width:0}
.row-t{font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{color:var(--fg-2);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--brand);background:var(--brand-soft);padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
.chev{color:var(--fg-3);width:18px;height:18px}
.badge{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:13px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge .ic{width:14px;height:14px;stroke-width:2.4}
.b-todo{background:var(--fill);color:var(--fg)}
.b-urgent{background:var(--danger-soft);color:var(--danger)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:28px 20px;text-align:center;color:var(--fg-2);font-size:15px}
.empty strong{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}

/* Detail header */
.hero{display:flex;gap:14px;align-items:center;padding-block:4px 4px}
.hero img{width:84px;height:84px;border-radius:18px;object-fit:cover;flex:none;box-shadow:var(--shadow)}
.hero h1{font:700 30px/1.1 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.hero p{margin:5px 0 0;color:var(--fg-2);font-size:15px}
.prog{margin-top:18px;background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow)}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.prog-top b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.prog-top span{color:var(--fg-2)}
.track{height:6px;border-radius:3px;background:var(--fill);margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .5s var(--ease)}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.act{background:var(--surface);border-radius:var(--r-lg);min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;box-shadow:var(--shadow);transition:transform .15s var(--ease),background .15s;padding:8px 4px;text-align:center}
.act .ic{width:24px;height:24px;color:var(--brand)}
.act:active{transform:scale(.96);background:var(--surface-2)}
.act.primary{background:var(--brand);color:var(--on-brand)}
.act.primary .ic{color:var(--on-brand)}

/* Task rows */
.task{display:flex;align-items:flex-start;gap:4px;position:relative;min-height:54px}
.task+.task::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.chk{width:52px;min-height:54px;flex:none;display:flex;align-items:center;justify-content:center}
.chk span{width:26px;height:26px;border-radius:50%;border:2px solid var(--fg-3);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .25s var(--ease)}
.chk span .ic{width:16px;height:16px;stroke-width:3;color:#fff;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--ease)}
.chk[aria-checked="true"] span{background:var(--ok);border-color:var(--ok)}
.chk[aria-checked="true"] span .ic{opacity:1;transform:none;color:var(--surface)}
.chk:active span{transform:scale(.86)}
.task-b{flex:1;min-width:0;text-align:left;padding:15px 14px 13px 0;display:block}
.task-t{font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.task.done .task-t{color:var(--fg-3);text-decoration:line-through;text-decoration-color:var(--fg-3)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;font-size:13px;color:var(--fg-2);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .ic{width:14px;height:14px}
.meta .urg{color:var(--danger);font-weight:600}
.meta .late{color:var(--danger)}
.meta .soon{color:var(--warn)}
.note-prev{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.notes{width:100%;min-height:110px;border:0;background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;font-size:16px;line-height:1.45;resize:vertical;box-shadow:var(--shadow);outline:none}
.notes:focus-visible{outline:2px solid var(--brand);outline-offset:0}
.foot{color:var(--fg-3);font-size:13px;margin:8px 16px 0}

/* Sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:20}
#scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:620px;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .42s var(--ease);display:flex;flex-direction:column;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fg-3);opacity:.5;margin:7px auto 0}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;height:52px}
.sheet-h h2{font-size:17px;font-weight:600;margin:0}
.sheet-h .nbtn{padding:0 8px}.sheet-h .nbtn.strong{font-weight:600;justify-self:end}
.sheet-b{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.field{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.field label{display:block;font-size:13px;color:var(--fg-2);padding:10px 14px 0}
.field input[type=text],.field textarea{width:100%;border:0;background:none;outline:none;padding:4px 14px 12px;font-size:17px}
.field textarea{min-height:76px;resize:vertical;font-size:16px}
.lbl{font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--fg-2);margin:20px 14px 7px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{min-height:56px;border-radius:var(--r-md);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500;color:var(--fg-2);border:2px solid transparent;transition:border-color .15s,color .15s}
.cat .ic{width:20px;height:20px}
.cat[aria-checked="true"]{border-color:var(--brand);color:var(--brand);font-weight:600}
.list-f{background:var(--surface);border-radius:var(--r-md)}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 14px;position:relative}
.lrow+.lrow::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.lrow input[type=date]{border:0;background:var(--fill);border-radius:8px;padding:6px 10px;font-size:16px;color:var(--fg);min-height:36px}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s var(--ease)}
.switch[aria-checked="true"]{background:var(--danger)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.danger-btn{width:100%;min-height:50px;margin-top:22px;border-radius:var(--r-md);background:var(--surface);color:var(--danger);font-size:17px;font-weight:500}
.danger-btn.armed{background:var(--danger);color:var(--surface);font-weight:600}
.plain-btn{width:100%;min-height:50px;border-radius:0;background:none;color:var(--brand);font-size:17px;text-align:left;padding:0 14px;display:flex;align-items:center;gap:10px}
.plain-btn.red{color:var(--danger)}
.hint{color:var(--fg-2);font-size:13px;margin:8px 14px 0;line-height:1.45}
.err{color:var(--danger);font-size:13px;margin:6px 14px 0}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:40;background:var(--fg);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .4s var(--ease);visibility:hidden}
#toast.on{transform:translate(-50%,0);visibility:visible}
#toast button{min-height:36px;padding:0 12px;border-radius:9px;font-weight:600;color:var(--bg);background:rgba(127,127,127,.28)}
#toast button[hidden]{display:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (min-width:700px){.large h1{font-size:40px}}
</style>

<div id="splash" role="img" aria-label="BookingAlger">
  <img src="img/logo.png" alt="" width="1000" height="240">
  <div class="bar" aria-hidden="true"></div>
</div>

<main id="home" class="view" aria-label="Appartements">
  <header class="nav" id="homeNav">
    <div class="nav-in">
      <span class="nav-l"></span>
      <span class="nav-title">Appartements</span>
      <span class="nav-r"><button class="nbtn round" data-act="settings" aria-label="Réglages"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button></span>
    </div>
  </header>
  <div class="wrap">
    <div class="large" id="homeLarge">
      <div class="brandline"><img src="img/logo.png" alt="BookingAlger" width="92" height="22"></div>
      <h1>Appartements</h1>
      <p class="sub" id="homeSub"></p>
    </div>
    <label class="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="sr">Rechercher un appartement</span><input id="q" type="search" placeholder="Rechercher" autocomplete="off"></label>
    <div class="seg" role="group" aria-label="Filtrer" id="seg"></div>
    <div class="sec-h"><span id="listLabel">Tous les appartements</span></div>
    <div class="group" id="aptList"></div>
    <p class="foot" id="modeNote"></p>
  </div>
</main>

<section id="detail" class="view" aria-label="Détail de l’appartement" aria-hidden="true">
  <header class="nav" id="detNav">
    <div class="nav-in">
      <span class="nav-l"><button class="nbtn back" data-act="back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Appartements</button></span>
      <span class="nav-title" id="detNavTitle"></span>
      <span class="nav-r"><button class="nbtn round" data-act="new" aria-label="Nouvelle tâche"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></span>
    </div>
  </header>
  <div class="wrap" id="detBody"></div>
</section>

<div id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" hidden>Annuler</button></div>

<script>
(() => {
'use strict';
/* ---------- Données ---------- */
const APTS = [
  {id:'escapade', name:'L’Escapade', type:'F3', tag:'Proche tramway et mer'},
  {id:'emeraude', name:'L’Émeraude', type:'F3', tag:'Terrasse jacuzzi & vue sur mer', jacuzzi:1},
  {id:'refuge',   name:'Le Refuge',  type:'F3', tag:'Résidence proche mer et tramway'},
  {id:'hibiscus', name:'L’Hibiscus', type:'F4', tag:'Résidence avec suite parentale'},
  {id:'riadcity', name:'RiadCity',   type:'F3', tag:'Jacuzzi, résidence RiadCity', jacuzzi:1},
  {id:'magnolia', name:'Le Magnolia',type:'F3', tag:'Cosy, proche tramway et mer'},
  {id:'escale',   name:'L’Escale',   type:'F3', tag:'Grand F3, résidence privée'},
  {id:'cocon',    name:'Le Cocon',   type:'F2', tag:'Résidence privée avec parking'},

/* ---------- Stockage ---------- */
const LS = 'bookingalger.v1';
let tasks = new Map();   // id -> task
let notes = {};          // aptId -> text
let db = null;           // espace db de l'artifact (synchronisé) ou null (appareil)
let syncState = 'local'; // local | connecting | synced | stale
const writing = {};      // file d'écriture par document

function lsRead(){ try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch { return {}; } }
function lsWrite(){ if (db) return; try { localStorage.setItem(LS, JSON.stringify({tasks:[...tasks.values()], notes})); } catch {} }
(function boot(){ const d = lsRead(); (d.tasks||[]).forEach(t => t && t.id && tasks.set(t.id, t)); notes = d.notes || {}; })();

function queue(key, fn){ const p = (writing[key] || Promise.resolve()).then(fn, fn); writing[key] = p.catch(()=>{}); return p; }
function clean(o){ const r = {}; for (const k in o) if (k !== 'id' && o[k] !== undefined) r[k] = o[k]; return r; }

async function putTask(t){
  tasks.set(t.id, t); lsWrite(); renderAll();
  if (db) try { await queue('t'+t.id, () => db.collection('tasks').doc(t.id).set(clean(t))); } catch(e){ fail(e); }
}
async function delTask(id){
  tasks.delete(id); lsWrite(); renderAll();
  if (db) try { await queue('t'+id, () => db.collection('tasks').doc(id).delete()); } catch(e){ fail(e); }
}
let noteTimer = null;
function putNote(apt, text){
  notes[apt] = text; lsWrite();
  clearTimeout(noteTimer);
  if (db) noteTimer = setTimeout(() => queue('n'+apt, () => db.collection('notes').doc(apt).set({text})).catch(fail), 700);
}
function fail(e){ toast(e && e.code === 'quota_exceeded' ? 'Stockage plein : supprimez des tâches terminées.' : 'Enregistrement impossible pour le moment.'); }

async function connect(){
  if (!window.claude || typeof window.claude.use !== 'function') { renderAll(); return; }
  syncState = 'connecting'; renderAll();
  let ns = null; try { ns = await window.claude.use('db'); } catch {}
  if (!ns) { syncState = 'local'; renderAll(); return; }
  db = ns; syncState = 'connecting';
  const local = lsRead();
  const stale = setTimeout(() => { if (syncState === 'connecting') { syncState = 'stale'; renderAll(); } }, 10000);
  db.collection('tasks').onSnapshot(snap => {
    tasks = new Map(snap.docs.map(d => [d.id, {id:d.id, ...d.data()}]));
    if (!snap.metadata.fromCache) { clearTimeout(stale); syncState = 'synced'; }
    renderAll();
  }, () => { clearTimeout(stale); syncState = 'stale'; renderAll(); });
  db.collection('notes').onSnapshot(snap => {
    const n = {}; snap.docs.forEach(d => n[d.id] = (d.data()||{}).text || '');
    const active = document.activeElement && document.activeElement.id === 'aptNotes';
    notes = n; if (!active) renderDetail();
  }, () => {});
  // Reprend les tâches saisies sur cet appareil avant la synchronisation
  if ((local.tasks||[]).length || Object.keys(local.notes||{}).length) {
    for (const t of local.tasks||[]) if (t && t.id) await queue('t'+t.id, () => db.collection('tasks').doc(t.id).set(clean(t))).catch(()=>{});
    for (const [k,v] of Object.entries(local.notes||{})) if (v) await queue('n'+k, () => db.collection('notes').doc(k).set({text:v})).catch(()=>{});
    try { localStorage.removeItem(LS); } catch {}
  }
}

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,20);
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const dayDiff = iso => Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 864e5);
function dueLabel(iso){
  const n = dayDiff(iso);
  if (n === 0) return 'Aujourd’hui'; if (n === 1) return 'Demain'; if (n === -1) return 'Hier';
  return new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
}
const isUrgent = t => !t.done && (t.urgent || (t.due && dayDiff(t.due) < 0));
const sortTasks = (a, b) => (isUrgent(b) - isUrgent(a)) || ((a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : 0) || ((a.createdAt||0) - (b.createdAt||0));
function stats(aptId){
  let pending = 0, urgent = 0, done = 0;
  for (const t of tasks.values()) if (t.apt === aptId) { if (t.done) done++; else { pending++; if (isUrgent(t)) urgent++; } }
  return {pending, urgent, done};
}
const plural = (n, s, p) => `${n} ${n > 1 ? (p || s + 's') : s}`;
function buzz(){ try { navigator.vibrate && navigator.vibrate(8); } catch {} }

  const counts = {all: APTS.length, todo: all.filter(x => x.s.pending).length, urgent: all.filter(x => x.s.urgent).length, ok: all.filter(x => !x.s.pending).length};
  const date = new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  $('#homeSub').textContent = `${date.charAt(0).toUpperCase() + date.slice(1)} · ` +
    (totalPending ? `${plural(totalPending, 'tâche')} à faire${totalUrgent ? `, dont ${totalUrgent} urgente${totalUrgent > 1 ? 's' : ''}` : ''}` : 'Tout est à jour');

  const idx = FILTERS.findIndex(f => f[0] === filter);
  $('#seg').innerHTML = `<span class="pill" style="transform:translateX(${idx * 100}%)" aria-hidden="true"></span>` +
    FILTERS.map(([k, l]) => `<button data-filter="${k}" aria-pressed="${k === filter}">${l} <span class="n">${counts[k]}</span></button>`).join('');

  const q = query.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const list = all.filter(({a, s}) => {
    if (filter === 'todo' && !s.pending) return false;
    if (filter === 'urgent' && !s.urgent) return false;
    if (filter === 'ok' && s.pending) return false;
    if (!q) return true;
    return (a.name + ' ' + a.type + ' ' + a.tag).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q);
  });
  if (filter === 'todo' || filter === 'urgent') list.sort((x, y) => (y.s.urgent - x.s.urgent) || (y.s.pending - x.s.pending));
  $('#listLabel').textContent = {all:'Tous les appartements', todo:'Avec des tâches à faire', urgent:'Avec des tâches urgentes', ok:'À jour'}[filter] + ` · ${list.length}`;

  $('#aptList').innerHTML = list.length ? list.map(({a, s}) => {
    const badge = s.urgent ? `<span class="badge b-urgent">${ic('alert')}${s.pending}<span class="sr"> tâches, dont ${s.urgent} urgentes</span></span>`

      : `<span class="badge b-ok">${ic('check')}À jour</span>`;
    return `<a class="row" href="#${a.id}">
      <img class="thumb" src="img/${a.id}.jpg" alt="" width="58" height="58" loading="lazy">
      <span class="row-body"><span class="row-t" style="display:block">${esc(a.name)}</span>
      <span class="row-s" style="display:block"><span class="type">${a.type}</span>${esc(a.tag)}</span></span>
      ${badge}${ic('chev','chev')}</a>`;
  }).join('') : `<div class="empty"><strong>Aucun appartement</strong>${q ? 'Aucun nom ne correspond à votre recherche.' : filter === 'ok' ? 'Tous les appartements ont des tâches en cours.' : 'Rien à signaler dans ce filtre.'}</div>`;

  $('#modeNote').textContent = {
    local: 'Données enregistrées sur cet appareil.',
    connecting: 'Synchronisation en cours…',
    synced: 'Synchronisé : vos tâches sont les mêmes sur tous vos appareils.',
    stale: 'Connexion lente : les tâches affichées peuvent ne pas être à jour.',
  }[syncState];
}

let current = null, showDone = false;

function taskRow(t){
  const metas = [];
  if (t.urgent && !t.done) metas.push(`<span class="urg">${ic('alert')}Urgent</span>`);
  metas.push(`<span>${ic(t.cat || 'autre')}${CATS[t.cat] || 'Autre'}</span>`);
  if (t.due) { const n = dayDiff(t.due); metas.push(`<span class="${!t.done && n < 0 ? 'late' : !t.done && n <= 1 ? 'soon' : ''}">${ic('cal')}${dueLabel(t.due)}${!t.done && n < 0 ? ' · en retard' : ''}</span>`); }
  if (t.note) metas.push(`<span class="note-prev">${ic('note')}${esc(t.note)}</span>`);
  return `<div class="task ${t.done ? 'done' : ''}">
    <button class="chk" role="checkbox" aria-checked="${!!t.done}" data-toggle="${t.id}" aria-label="${t.done ? 'Marquer à faire' : 'Marquer comme fait'} : ${esc(t.title)}"><span>${ic('check')}</span></button>
    <button class="task-b" data-edit="${t.id}"><span class="task-t">${esc(t.title)}</span><span class="meta">${metas.join('')}</span></button>
  </div>`;
}

}

/* ---------- Navigation ---------- */
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  if (byId[id]) {
    const changed = current !== id; current = id; if (changed) showDone = false;
    renderDetail();
    if (changed) $('#detail').scrollTop = 0;
    $('#detail').classList.add('open'); $('#detail').setAttribute('aria-hidden','false');
    $('#home').setAttribute('aria-hidden','true'); document.body.classList.add('pushed');
    onScroll($('#detail'), $('#detNav'), 40);
  } else {
    current = null; closeSheet(true);
    $('#detail').classList.remove('open'); $('#detail').setAttribute('aria-hidden','true');
    $('#home').removeAttribute('aria-hidden'); document.body.classList.remove('pushed');
  }
}
let pushedFromHome = false;
function back(){ if (pushedFromHome) { pushedFromHome = false; history.back(); } else { location.hash = ''; route(); } }

  const title = $('#fTitle').value.trim();
  if (!title) { $('#fErr').hidden = false; $('#fTitle').focus(); return; }
  const t = {...(tasks.get(e.id) || {}), id: e.id || uid(), apt: e.apt, title, cat: e.cat, urgent: !!e.urgent, due: $('#fDue').value || '', note: $('#fNote').value.trim(), done: e.id ? !!e.done : false, createdAt: e.createdAt || Date.now()};
  const isNew = !e.id;
  closeSheet(); putTask(t); buzz();
  toast(isNew ? 'Tâche ajoutée' : 'Tâche modifiée');
}

function settingsSheet(){
  const isLocal = !db;
  const nDone = [...tasks.values()].filter(t => t.done).length;
  openSheet(`
    <div class="sheet-h"><span></span><h2 id="sheetTitle">Réglages</h2><button class="nbtn strong" data-act="close">OK</button></div>
    <div class="sheet-b">
      <div class="list-f" style="padding:14px;display:flex;gap:12px;align-items:center">
        <img src="img/mark.png" alt="" width="20" height="36" style="height:36px;width:auto">
        <div><div style="font-weight:600">BookingAlger · ${APTS.length} appartements</div><div style="color:var(--fg-2);font-size:14px">${[...tasks.values()].filter(t=>!t.done).length} tâches à faire · ${nDone} faites</div></div>
      </div>
      <div class="lbl">Tâches</div>
      <div class="list-f">
        <button class="plain-btn red" data-act="clearAllDone" ${nDone ? '' : 'disabled style="opacity:.4;cursor:default"'}>${ic('trash')}Effacer toutes les tâches faites (${nDone})</button>
      </div>
      ${isLocal ? `<div class="lbl">Sauvegarde</div>
      <div class="list-f">
        <button class="plain-btn" data-act="export">${ic('down')}Exporter une sauvegarde</button>
        <div class="lrow" style="padding:0"><label class="plain-btn" for="importFile" style="cursor:pointer">${ic('up')}Importer une sauvegarde</label><input type="file" id="importFile" accept="application/json,.json" class="sr"></div>
      </div>
      <p class="hint">Vos tâches sont enregistrées sur ce téléphone. Exportez une sauvegarde de temps en temps pour ne rien perdre.</p>`
      : `<p class="hint">${ic('cloud')} Vos tâches sont synchronisées : ouvrez ce lien sur un autre appareil pour retrouver la même liste.</p>`}
    </div>`);
}

/* ---------- Toast + annulation ---------- */
let toastTimer = null, undoFn = null;
function toast(msg, undo){
  $('#toastMsg').textContent = msg; undoFn = undo || null; $('#toastUndo').hidden = !undo;
  $('#toast').classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').classList.remove('on'); undoFn = null; }, undo ? 5000 : 2200);
}
$('#toastUndo').addEventListener('click', () => { const f = undoFn; undoFn = null; $('#toast').classList.remove('on'); f && f(); });

/* ---------- Actions ---------- */
async function addTemplate(kind){
  const a = byId[current];
  const existing = new Set([...tasks.values()].filter(t => t.apt === a.id && !t.done).map(t => t.title));
  const base = Date.now();
  const items = TPL[kind](a).filter(([title]) => !existing.has(title))
    .map(([title, cat], i) => ({id: uid(), apt: a.id, title, cat, urgent:false, due: kind === 'depart' ? todayISO() : '', note:'', done:false, createdAt: base + i}));
  if (!items.length) { toast('Cette checklist est déjà dans la liste.'); return; }
  buzz();
  items.forEach(t => tasks.set(t.id, t)); lsWrite(); renderAll();
  toast(`${plural(items.length, 'tâche')} ajoutée${items.length > 1 ? 's' : ''}`, () => items.forEach(t => delTask(t.id)));
  if (db) for (const t of items) await queue('t'+t.id, () => db.collection('tasks').doc(t.id).set(clean(t))).catch(fail);
}

async function clearDone(aptId){
  const gone = [...tasks.values()].filter(t => t.done && (!aptId || t.apt === aptId));
  if (!gone.length) return;
  gone.forEach(t => tasks.delete(t.id)); lsWrite(); renderAll();
  toast(`${plural(gone.length, 'tâche')} effacée${gone.length > 1 ? 's' : ''}`, () => gone.forEach(t => putTask(t)));
  if (db) for (const t of gone) await queue('t'+t.id, () => db.collection('tasks').doc(t.id).delete()).catch(fail);
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act],[data-filter],[data-toggle],[data-edit],[data-tpl],[data-cat],a.row');
  if (!el) return;
  if (el.matches('a.row')) { pushedFromHome = true; return; }
  if (el.dataset.filter) { filter = el.dataset.filter; renderHome(); return; }
  if (el.dataset.toggle) {
    const t = tasks.get(el.dataset.toggle); if (!t) return;
    buzz(); putTask({...t, done: !t.done, doneAt: !t.done ? Date.now() : null}); return;
  }
  if (el.dataset.edit) { const t = tasks.get(el.dataset.edit); t && taskSheet(t); return; }
  if (el.dataset.tpl) { addTemplate(el.dataset.tpl); return; }
  if (el.dataset.cat && editing) {
    editing.cat = el.dataset.cat;
    document.querySelectorAll('.cat').forEach(b => b.setAttribute('aria-checked', b.dataset.cat === editing.cat)); return;
  }
  switch (el.dataset.act) {
    case 'back': back(); break;
    case 'new': if (current) taskSheet(null); break;
    case 'settings': settingsSheet(); break;
    case 'close': closeSheet(); break;
    case 'save': saveTask(); break;
    case 'urgent': editing.urgent = !editing.urgent; el.setAttribute('aria-checked', editing.urgent); break;
    case 'delete':
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Confirmer la suppression'; return; }
      { const t = tasks.get(editing.id); closeSheet(); delTask(t.id); toast('Tâche supprimée', () => putTask(t)); }
      break;
    case 'toggleDone': showDone = !showDone; renderDetail(); break;
    case 'clearDone': clearDone(current); break;
    case 'clearAllDone': closeSheet(); clearDone(null); break;
    case 'export': {
      const blob = new Blob([JSON.stringify({app:'BookingAlger', date:new Date().toISOString(), tasks:[...tasks.values()], notes}, null, 1)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bookingalger-sauvegarde-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('Sauvegarde exportée'); break;
    }
  }
});

document.addEventListener('submit', ev => { ev.preventDefault(); if (ev.target.id === 'taskForm') saveTask(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet();
  if (ev.key === 'Enter' && ev.target.id === 'fTitle') { ev.preventDefault(); saveTask(); }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'q') { query = ev.target.value; renderHome(); }
  if (ev.target.id === 'aptNotes' && current) putNote(current, ev.target.value);
  if (ev.target.id === 'fTitle') $('#fErr').hidden = true;
});
document.addEventListener('change', ev => {
  if (ev.target.id !== 'importFile' || !ev.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (!Array.isArray(d.tasks)) throw 0;
      d.tasks.forEach(t => t && t.id && byId[t.apt] && tasks.set(t.id, t)); notes = {...notes, ...(d.notes || {})};
      lsWrite(); renderAll(); closeSheet(); toast(`${plural(d.tasks.length, 'tâche')} importée${d.tasks.length > 1 ? 's' : ''}`);
    } catch { toast('Ce fichier n’est pas une sauvegarde BookingAlger.'); }
  };
  r.readAsText(ev.target.files[0]);
});

$('#home').addEventListener('scroll', e => onScroll(e.target, $('#homeNav'), 56), {passive:true});
$('#detail').addEventListener('scroll', e => onScroll(e.target, $('#detNav'), 40), {passive:true});
window.addEventListener('hashchange', route);
// Retour par glissement depuis le bord gauche (comme sur iOS)
let sx = null, sy = 0;
$('#detail').addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX < 24 ? t.clientX : null; sy = t.clientY; }, {passive:true});
$('#detail').addEventListener('touchend', e => { if (sx === null) return; const t = e.changedTouches[0]; if (t.clientX - sx > 80 && Math.abs(t.clientY - sy) < 60) back(); sx = null; }, {passive:true});

/* ---------- Démarrage ---------- */
renderHome(); route(); connect();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(() => { $('#splash').classList.add('out'); setTimeout(() => $('#splash').remove(), 500); }, reduce ? 700 : 1600);
if ('serviceWorker' in navigator && window.top === window && location.protocol === 'https:' && !window.claude) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>

</body>
