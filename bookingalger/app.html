<title>BookingAlger Tâches</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-style tab app — splash, then a 2-column photo grid of apartments (tab 1) and the Wi-Fi boxes (tab 2); an apartment pushes a detail screen. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#F6F8F9; --fg:#0E1B23; --fg-2:#566570; --fg-3:#8A96A0;
  --sep:rgba(14,27,35,.1); --fill:rgba(110,124,136,.13); --scrim:rgba(8,16,22,.4);
  --brand:#0F78A3; --on-brand:#FFFFFF; --brand-soft:#E2F0F6; --green:#22693A;
  --ok:#22693A; --ok-soft:#E3F1E7; --danger:#C2342B; --danger-soft:#FBE8E6; --warn:#9A5B00;
  --hero-a:#0D6F98; --hero-b:#1D6B3B;
  --bar:rgba(248,250,251,.84); --shadow:0 1px 2px rgba(14,27,35,.05),0 8px 28px rgba(14,27,35,.07);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
  --r-xl:22px; --r-lg:16px; --r-md:12px; --ease:cubic-bezier(.32,.72,0,1); --t-push:440ms;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#16191C; --surface-2:#1E2226; --fg:#F1F5F7; --fg-2:#A1ADB5; --fg-3:#6F7C85;
  --sep:rgba(255,255,255,.1); --fill:rgba(130,142,152,.22); --scrim:rgba(0,0,0,.6);
  --brand:#52B6DF; --on-brand:#03202C; --brand-soft:rgba(82,182,223,.16); --green:#62C784;
  --ok:#62C784; --ok-soft:rgba(98,199,132,.15); --danger:#FF6F62; --danger-soft:rgba(255,111,98,.16); --warn:#F2B04C;
  --hero-a:#0B5677; --hero-b:#17512D;
  --bar:rgba(18,20,22,.82); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#16191C; --surface-2:#1E2226; --fg:#F1F5F7; --fg-2:#A1ADB5; --fg-3:#6F7C85;
  --sep:rgba(255,255,255,.1); --fill:rgba(130,142,152,.22); --scrim:rgba(0,0,0,.6);
  --brand:#52B6DF; --on-brand:#03202C; --brand-soft:rgba(82,182,223,.16); --green:#62C784;
  --ok:#62C784; --ok-soft:rgba(98,199,132,.15); --danger:#FF6F62; --danger-soft:rgba(255,111,98,.16); --warn:#F2B04C;
  --hero-a:#0B5677; --hero-b:#17512D;
  --bar:rgba(18,20,22,.82); --shadow:none; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#splash img{width:min(74vw,340px);height:auto;animation:logoIn .9s var(--ease) both}
#splash .bar{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:44px;height:3px;border-radius:2px;background:#E6EEF2;overflow:hidden}
#splash .bar::after{content:"";display:block;height:100%;width:40%;background:#1A8CB6;border-radius:2px;animation:load 1.1s ease-in-out infinite}
#splash.out{opacity:0;visibility:hidden}
@keyframes logoIn{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* Views */
.view{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);-webkit-overflow-scrolling:touch}
.tabview{transition:transform var(--t-push) var(--ease),filter var(--t-push)}
body.pushed .tabview{transform:translateX(-26%);filter:brightness(.9)}
#detail{transform:translateX(100%);transition:transform var(--t-push) var(--ease);z-index:30;box-shadow:-12px 0 40px rgba(0,0,0,.12);visibility:hidden}
#detail.open{transform:none;visibility:visible}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

/* Nav bar */
.nav{position:sticky;top:0;z-index:4;padding-top:env(safe-area-inset-top,0px);transition:background .25s,box-shadow .25s}
.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav-in{max-width:760px;margin:0 auto;height:50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-title{font-weight:600;font-size:17px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.nav.solid .nav-title{opacity:1;transform:none}
.nav-l{justify-self:start}.nav-r{justify-self:end;display:flex;gap:6px}
.nbtn{min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;gap:2px;color:var(--brand);border-radius:22px;font-size:17px;transition:opacity .15s,background .25s,color .25s}
.nbtn:active{opacity:.45}
.nbtn .ic{width:22px;height:22px}
.round{width:36px;min-width:36px;height:36px;margin:4px;background:var(--fill)}
.round .ic{width:20px;height:20px}
.back{padding:0 12px 0 6px}.back .ic{width:24px;height:24px;stroke-width:2.4}
/* Detail nav over the photo banner */
#detNav:not(.solid) .nbtn{color:#fff;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#detNav:not(.solid) .back{margin-left:4px;height:36px}

/* Large title */
.large{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:0 12px}
.brandline img{height:24px;width:auto;display:block;margin-bottom:8px}
.large h1{font:800 34px/1.1 var(--font-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.sub{color:var(--fg-2);font-size:15px;margin:5px 0 0}

/* Summary hero */
.summary{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:14px 16px 14px;color:#fff;background:linear-gradient(135deg,var(--hero-a) 0%,#12698A 52%,var(--hero-b) 100%);box-shadow:0 10px 30px rgba(13,111,152,.22)}
.summary::before,.summary::after{content:"";position:absolute;border:2px solid rgba(255,255,255,.16);border-radius:16px;width:120px;height:150px;transform:skewY(-8deg)}
.summary::before{right:-18px;top:-30px}
.summary::after{right:24px;top:6px;border-color:rgba(255,255,255,.1)}
.sum-k{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.sum-n{font:800 34px/1.05 var(--font-display);letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.sum-n small{font-size:18px;font-weight:600;letter-spacing:-.01em;margin-left:6px}
.sum-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;position:relative}
.sum-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:rgba(255,255,255,.17);font-size:13px;font-weight:600;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sum-chip .ic{width:15px;height:15px;stroke-width:2.4}
.sum-chip.red{background:#fff;color:#B42C24}

/* Search + filter chips */
.search{display:flex;align-items:center;gap:6px;height:40px;border-radius:12px;background:var(--fill);padding:0 12px;color:var(--fg-3);margin-top:16px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font-size:17px;height:100%}
.search input::placeholder{color:var(--fg-3)}
.search .ic{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:2px max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--surface);color:var(--fg);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1px var(--sep);transition:background .2s,color .2s}
.chip .n{color:var(--fg-3);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}

/* Apartment grid */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--fg-2);margin:24px 4px 10px;font-weight:500}
.sec-h button{color:var(--brand);text-transform:none;letter-spacing:0;font-size:15px;min-height:44px;margin:-14px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
.card{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:var(--r-xl);overflow:hidden;display:block;background:var(--fill);box-shadow:var(--shadow);transition:transform .2s var(--ease);isolation:isolate}
.card:active{transform:scale(.965)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .5s var(--ease)}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 45%,rgba(0,0,0,.72) 100%)}
.card-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.glass{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:13px;font-size:12px;font-weight:700;color:#fff;background:rgba(20,26,30,.36);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);font-variant-numeric:tabular-nums;white-space:nowrap}
.glass .ic{width:13px;height:13px;stroke-width:2.6}
.glass.ok{background:rgba(255,255,255,.92);color:#1D6B3B}
.glass.todo{background:rgba(255,255,255,.92);color:#0E1B23}
.glass.urg{background:#E5483E;color:#fff}
.card-b{position:absolute;left:12px;right:12px;bottom:11px;color:#fff}
.card-t{font:700 18px/1.15 var(--font-display);letter-spacing:-.015em;text-shadow:0 1px 8px rgba(0,0,0,.3);overflow-wrap:anywhere}
.card-s{font-size:12.5px;opacity:.88;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:30px 20px;text-align:center;color:var(--fg-2);font-size:15px;background:var(--surface);border-radius:var(--r-lg)}
.empty strong{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.foot{color:var(--fg-3);font-size:13px;margin:16px 4px 0;display:flex;align-items:center;gap:6px}
.foot .ic{width:15px;height:15px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);transition:transform var(--t-push) var(--ease)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;height:58px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--fg-3);transition:color .2s}
.tab .ic{width:25px;height:25px;stroke-width:1.9}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] .ic{stroke-width:2.3}
body.pushed .tabbar{transform:translateX(-26%)}

/* Detail banner */
.banner{position:relative;overflow:hidden;margin-top:calc(-50px - env(safe-area-inset-top,0px));padding:calc(64px + env(safe-area-inset-top,0px)) 16px 46px;text-align:center;color:#fff;isolation:isolate}
.banner .bg{position:absolute;inset:-40px;z-index:-2;background-size:cover;background-position:center;filter:blur(28px) saturate(140%);transform:scale(1.1)}
.banner::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.5))}
.banner img{width:124px;height:124px;border-radius:30px;object-fit:cover;box-shadow:0 12px 34px rgba(0,0,0,.35),0 0 0 3px rgba(255,255,255,.25)}
.banner h1{font:800 30px/1.1 var(--font-display);letter-spacing:-.025em;margin:16px 0 0;text-wrap:balance}
.banner p{margin:6px 0 0;font-size:15px;opacity:.9}
.banner .glass{vertical-align:1px;margin-right:6px;height:22px;font-size:11px;background:rgba(255,255,255,.2)}
.sheet-top{position:relative;margin-top:-24px;background:var(--bg);border-radius:24px 24px 0 0;padding-top:16px}

.prog{background:var(--surface);border-radius:var(--r-lg);padding:15px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.ring{width:52px;height:52px;flex:none;position:relative}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:var(--fill)}.ring .va{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.prog b{display:block;font-size:19px;letter-spacing:-.01em}
.prog small{color:var(--fg-2);font-size:14px}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.act{background:var(--surface);border-radius:var(--r-lg);min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;box-shadow:var(--shadow);transition:transform .15s var(--ease),background .15s;padding:8px 4px;text-align:center}
.act .ic{width:24px;height:24px;color:var(--brand)}
.act:active{transform:scale(.95);background:var(--surface-2)}
.act.primary{background:var(--brand);color:var(--on-brand)}
.act.primary .ic{color:var(--on-brand)}

.group{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.task{display:flex;align-items:flex-start;gap:4px;position:relative;min-height:54px}
.task+.task::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.chk{width:52px;min-height:54px;flex:none;display:flex;align-items:center;justify-content:center}
.chk span{width:26px;height:26px;border-radius:50%;border:2px solid var(--fg-3);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .25s var(--ease)}
.chk span .ic{width:16px;height:16px;stroke-width:3;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--ease)}
.chk[aria-checked="true"] span{background:var(--ok);border-color:var(--ok)}
.chk[aria-checked="true"] span .ic{opacity:1;transform:none;color:var(--surface)}
.chk:active span{transform:scale(.86)}
.task-b{flex:1;min-width:0;text-align:left;padding:15px 14px 13px 0;display:block}
.task-t{font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.task.done .task-t{color:var(--fg-3);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;font-size:13px;color:var(--fg-2);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px;min-width:0}
.meta .ic{width:14px;height:14px}
.meta .urg{color:var(--danger);font-weight:600}
.meta .late{color:var(--danger)}.meta .soon{color:var(--warn)}
.note-prev{display:-webkit-box!important;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.notes{width:100%;min-height:110px;border:0;background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;font-size:16px;line-height:1.45;resize:vertical;box-shadow:var(--shadow);outline:none}
.notes:focus-visible{outline:2px solid var(--brand);outline-offset:0}

/* Wi-Fi */
.wcard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.wcard+.wcard{margin-top:12px}
.wh{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 12px}
.wh img{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none}
.wh-t{flex:1;min-width:0}
.wh-t b{display:block;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh-t small{color:var(--fg-2);font-size:13px}
.edit-btn{min-height:44px;padding:0 12px;color:var(--brand);font-size:15px;font-weight:500;border-radius:10px}
.wl{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 6px 0 16px;border-top:.5px solid var(--sep)}
.wl .k{width:96px;flex:none;color:var(--fg-2);font-size:14px}
.wl .v{flex:1;min-width:0;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text;padding-block:8px}
.wl .v.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:16px;letter-spacing:.02em}
.icb{width:44px;height:44px;flex:none;display:grid;place-items:center;color:var(--brand);border-radius:12px;transition:background .15s}
.icb:active{background:var(--fill)}
.icb .ic{width:20px;height:20px}
.add-w{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:0 16px;border-top:.5px solid var(--sep);color:var(--brand);font-size:16px;font-weight:500}
.add-w .ic{width:20px;height:20px}
.wifi-mini{margin-top:12px}

/* Sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:40}
#scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:620px;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .42s var(--ease);display:flex;flex-direction:column;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fg-3);opacity:.5;margin:7px auto 0}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;height:52px}
.sheet-h h2{font-size:17px;font-weight:600;margin:0}
.sheet-h .nbtn{padding:0 8px}.sheet-h .nbtn.strong{font-weight:600;justify-self:end}
.sheet-b{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.field{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.field label{display:block;font-size:13px;color:var(--fg-2);padding:10px 14px 0}
.field input,.field textarea{width:100%;border:0;background:none;outline:none;padding:4px 14px 12px;font-size:17px}
.field textarea{min-height:76px;resize:vertical;font-size:16px}
.field+.field{border-top:.5px solid var(--sep);border-radius:0}
.fields{border-radius:var(--r-md);overflow:hidden}
.lbl{font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--fg-2);margin:20px 14px 7px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{min-height:56px;border-radius:var(--r-md);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500;color:var(--fg-2);border:2px solid transparent;transition:border-color .15s,color .15s}
.cat .ic{width:20px;height:20px}
.cat[aria-checked="true"]{border-color:var(--brand);color:var(--brand);font-weight:600}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{height:36px;padding:0 14px;border-radius:18px;background:var(--surface);font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1px var(--sep)}
.op[aria-checked="true"]{background:var(--brand);color:var(--on-brand);box-shadow:none;font-weight:600}
.list-f{background:var(--surface);border-radius:var(--r-md)}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 14px;position:relative}
.lrow+.lrow::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.lrow input[type=date]{border:0;background:var(--fill);border-radius:8px;padding:6px 10px;font-size:16px;color:var(--fg);min-height:36px}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s var(--ease)}
.switch[aria-checked="true"]{background:var(--danger)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.danger-btn{width:100%;min-height:50px;margin-top:22px;border-radius:var(--r-md);background:var(--surface);color:var(--danger);font-size:17px;font-weight:500}
.danger-btn.armed{background:var(--danger);color:var(--surface);font-weight:600}
.plain-btn{width:100%;min-height:50px;background:none;color:var(--brand);font-size:17px;text-align:left;padding:0 14px;display:flex;align-items:center;gap:10px}
.plain-btn.red{color:var(--danger)}
.hint{color:var(--fg-2);font-size:13px;margin:8px 14px 0;line-height:1.45;display:flex;gap:6px}
.hint .ic{width:15px;height:15px;margin-top:1px}
.err{color:var(--danger);font-size:13px;margin:6px 14px 0}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;z-index:50;background:var(--fg);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font-size:15px;min-height:48px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .4s var(--ease),opacity .25s;visibility:hidden}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
#toast button{min-height:36px;padding:0 12px;border-radius:9px;font-weight:600;color:var(--bg);background:rgba(127,127,127,.28)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (min-width:700px){.large h1{font-size:40px}}

<script>
(() => {
'use strict';
/* ---------- Données ---------- */
const APTS = [
  {id:'escapade', name:'L’Escapade', type:'F3', tag:'Proche tramway et mer'},
  {id:'emeraude', name:'L’Émeraude', type:'F3', tag:'Terrasse jacuzzi & vue sur mer', jacuzzi:1},

  {id:'riadcity', name:'RiadCity',   type:'F3', tag:'Jacuzzi, résidence RiadCity', jacuzzi:1},
  {id:'magnolia', name:'Le Magnolia',type:'F3', tag:'Cosy, proche tramway et mer'},
  {id:'escale',   name:'L’Escale',   type:'F3', tag:'Grand F3, résidence privée'},

  {id:'dahlia',   name:'Le Dahlia',  type:'F3', tag:'Résidence privée'},
  {id:'evasion',  name:'L’Évasion',  type:'F2', tag:'Jacuzzi, résidence privée', jacuzzi:1},
  {id:'lilas',    name:'Le Lilas',   type:'F2', tag:'Résidence proche mer et tramway'},

  {id:'palmeria', name:'Le Palmeria',type:'F4', tag:'Résidence proche de la mer'},
  {id:'suite',    name:'La Suite',   type:'F2', tag:'Résidence privée avec parking'},
  {id:'horizon',  name:'L’Horizon',  type:'F2', tag:'Piscine terrasse', pool:1},
  {id:'nid',      name:'Le Nid',     type:'F2', tag:'Chic, proche tramway et mer'},
  {id:'rubis',    name:'Le Rubis',   type:'F3', tag:'Haut standing, résidence privée'},
  {id:'villa',    name:'Villa Luxe', type:'Villa', tag:'Piscine & hammam', pool:1, hammam:1},
  {id:'jasmin',   name:'Le Jasmin',  type:'F2', tag:'Résidence proche de la mer'},
  {id:'azur',     name:'L’Azur',     type:'F2', tag:'Cosy, résidence privée'},
  {id:'lotus',    name:'Le Lotus',   type:'F3', tag:'Confort & standing'},
  {id:'petunia',  name:'Le Pétunia', type:'F3', tag:'Cosy, résidence privée'},
];
const byId = Object.fromEntries(APTS.map(a => [a.id, a]));

const IC = {
  check:'<path d="M20 6 9 17l-5-5"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
  note:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  menage:'<path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.14-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.14a.5.5 0 0 1 .96 0l1.58 6.14a2 2 0 0 0 1.44 1.44l6.14 1.58a.5.5 0 0 1 0 .96l-6.14 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.14a.5.5 0 0 1-.96 0z"/>',
  linge:'<path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/>',
  maint:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  courses:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  accueil:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
  autre:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/>',
  depart:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  arrivee:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  down:'<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
  up:'<path d="M12 3v12"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/>',
  cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  eye:'<path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m2 2 20 20"/>',
  wifi:'<path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/>',
  phone:'<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
};
const ic = (n, cls='') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const CATS = {menage:'Ménage', linge:'Linge', maint:'Maintenance', courses:'Courses', accueil:'Accueil', autre:'Autre'};
const OPERATORS = ['Djezzy','Mobilis','Ooredoo','Algérie Télécom','Autre'];

const TPL = {
  depart: apt => [
    ['Aérer l’appartement','menage'],
    ['Ménage complet : sols, surfaces, poussière','menage'],
    ['Nettoyer salle de bain et WC','menage'],
    ['Cuisine : vaisselle, plaques, frigo à vider','menage'],
    ...(apt.jacuzzi ? [['Vider, nettoyer et désinfecter le jacuzzi','menage']] : []),
    ...(apt.pool ? [['Piscine : épuisette, chlore, niveau d’eau','maint']] : []),
    ...(apt.hammam ? [['Nettoyer le hammam','menage']] : []),
    ['Changer draps et housses','linge'],
    ['Changer les serviettes','linge'],
    ['Linge sale au pressing / lavage','linge'],
    ['Vider toutes les poubelles','menage'],
    ['Vérifier la casse et les objets oubliés','maint'],
    ['Réassort : café, sucre, papier toilette, savon','courses'],
    ['Récupérer les clés','accueil'],
  ],
  arrivee: apt => [
    ['Vérifier clim / chauffage','maint'],
    ['Allumer le chauffe-eau','maint'],
    ['Lit fait, serviettes posées','linge'],
    ['Eau, café et kit d’accueil','courses'],
    ...(apt.jacuzzi ? [['Remplir et tester le jacuzzi','maint']] : []),
    ...(apt.pool ? [['Piscine propre et prête','maint']] : []),
    ['Envoyer adresse, code Wi-Fi et accès','accueil'],
    ['Remettre les clés au voyageur','accueil'],
  ],
};

/* ---------- Stockage ---------- */
const LS = 'bookingalger.v1';
let tasks = new Map();   // id -> tâche
let notes = {};          // apt -> texte
let wifi = {};           // apt -> {op, line, ssid, pass, note}
let db = null;
let syncState = 'local';
const writing = {};

function lsRead(){ try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch { return {}; } }
function lsWrite(){ if (db) return; try { localStorage.setItem(LS, JSON.stringify({tasks:[...tasks.values()], notes, wifi})); } catch {} }
(function boot(){ const d = lsRead(); (d.tasks||[]).forEach(t => t && t.id && tasks.set(t.id, t)); notes = d.notes || {}; wifi = d.wifi || {}; })();

function queue(key, fn){ const p = (writing[key] || Promise.resolve()).then(fn, fn); writing[key] = p.catch(()=>{}); return p; }
function clean(o){ const r = {}; for (const k in o) if (k !== 'id' && o[k] !== undefined) r[k] = o[k]; return r; }
const dbSet = (col, id, data) => db ? queue(col+id, () => db.collection(col).doc(id).set(data)).catch(fail) : null;
const dbDel = (col, id) => db ? queue(col+id, () => db.collection(col).doc(id).delete()).catch(fail) : null;

function putTask(t){ tasks.set(t.id, t); lsWrite(); renderAll(); return dbSet('tasks', t.id, clean(t)); }
function delTask(id){ tasks.delete(id); lsWrite(); renderAll(); return dbDel('tasks', id); }
function putWifi(apt, w){ wifi[apt] = w; lsWrite(); renderAll(); return dbSet('wifi', apt, w); }
let noteTimer = null;
function putNote(apt, text){
  notes[apt] = text; lsWrite();
  clearTimeout(noteTimer);
  if (db) noteTimer = setTimeout(() => dbSet('notes', apt, {text}), 700);
}
function fail(e){ toast(e && e.code === 'quota_exceeded' ? 'Stockage plein : effacez des tâches faites.' : 'Enregistrement impossible pour le moment.'); }

async function connect(){
  if (!window.claude || typeof window.claude.use !== 'function') { renderAll(); return; }
  syncState = 'connecting'; renderAll();
  let ns = null; try { ns = await window.claude.use('db'); } catch {}
  if (!ns) { syncState = 'local'; renderAll(); return; }
  db = ns;
  const local = lsRead();
  const stale = setTimeout(() => { if (syncState === 'connecting') { syncState = 'stale'; renderAll(); } }, 10000);
  db.collection('tasks').onSnapshot(snap => {
    tasks = new Map(snap.docs.map(d => [d.id, {id:d.id, ...d.data()}]));
    if (!snap.metadata.fromCache) { clearTimeout(stale); syncState = 'synced'; }
    renderAll();
  }, () => { clearTimeout(stale); syncState = 'stale'; renderAll(); });
  db.collection('wifi').onSnapshot(snap => {
    const w = {}; snap.docs.forEach(d => w[d.id] = d.data() || {}); wifi = w; renderAll();
  }, () => {});
  db.collection('notes').onSnapshot(snap => {
    const n = {}; snap.docs.forEach(d => n[d.id] = (d.data()||{}).text || '');
    notes = n; if (!(document.activeElement && document.activeElement.id === 'aptNotes')) renderDetail();
  }, () => {});
  // Reprend ce qui a été saisi sur cet appareil avant la synchronisation
  const lt = local.tasks || [], ln = local.notes || {}, lw = local.wifi || {};
  if (lt.length || Object.keys(ln).length || Object.keys(lw).length) {
    for (const t of lt) if (t && t.id) await dbSet('tasks', t.id, clean(t));
    for (const [k,v] of Object.entries(ln)) if (v) await dbSet('notes', k, {text:v});
    for (const [k,v] of Object.entries(lw)) if (v) await dbSet('wifi', k, v);
    try { localStorage.removeItem(LS); } catch {}
  }
}

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,20);
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const dayDiff = iso => Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 864e5);
const fold = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function dueLabel(iso){
  const n = dayDiff(iso);
  if (n === 0) return 'Aujourd’hui'; if (n === 1) return 'Demain'; if (n === -1) return 'Hier';
  return new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
}
const isUrgent = t => !t.done && (t.urgent || (t.due && dayDiff(t.due) < 0));
const sortTasks = (a, b) => (isUrgent(b) - isUrgent(a)) || ((a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : 0) || ((a.createdAt||0) - (b.createdAt||0));
function stats(aptId){
  let pending = 0, urgent = 0, done = 0;
  for (const t of tasks.values()) if (t.apt === aptId) { if (t.done) done++; else { pending++; if (isUrgent(t)) urgent++; } }
  return {pending, urgent, done};
}
const plural = (n, s, p) => `${n} ${n > 1 ? (p || s + 's') : s}`;
const hasWifi = w => w && (w.line || w.ssid || w.pass);
const fmtLine = s => { const d = String(s||'').replace(/\s+/g,''); return /^\d{10}$/.test(d) ? d.replace(/(\d{4})(\d{2})(\d{2})(\d{2})/, '$1 $2 $3 $4') : String(s||''); };
function buzz(){ try { navigator.vibrate && navigator.vibrate(8); } catch {} }

/* ---------- Onglet Appartements ---------- */
let filter = 'all', query = '';
const FILTERS = [['all','Tous'],['todo','À faire'],['urgent','Urgent'],['ok','À jour']];

function renderHome(){
  const all = APTS.map(a => ({a, s: stats(a.id)}));
  const pend = all.reduce((n, x) => n + x.s.pending, 0);
  const urg = all.reduce((n, x) => n + x.s.urgent, 0);
  const counts = {all: APTS.length, todo: all.filter(x => x.s.pending).length, urgent: all.filter(x => x.s.urgent).length, ok: all.filter(x => !x.s.pending).length};
  const date = new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  $('#homeSub').textContent = date.charAt(0).toUpperCase() + date.slice(1);

  $('#summary').innerHTML = `
    <div class="sum-k">${pend ? 'Tâches à faire' : 'Tout est à jour'}</div>
    <div class="sum-n">${pend}<small>${pend ? `dans ${plural(counts.todo, 'appartement')}` : 'tâche en attente'}</small></div>
    <div class="sum-row">
      ${urg ? `<button class="sum-chip red" data-filter="urgent">${ic('alert')}${plural(urg, 'urgente')}</button>` : ''}
      <button class="sum-chip" data-filter="ok">${ic('check')}${counts.ok} à jour</button>
    </div>`;

  $('#chips').innerHTML = FILTERS.map(([k, l]) => `<button class="chip" data-filter="${k}" aria-pressed="${k === filter}">${l} <span class="n">${counts[k]}</span></button>`).join('');

  const q = fold(query.trim());
  const list = all.filter(({a, s}) => {
    if (filter === 'todo' && !s.pending) return false;
    if (filter === 'urgent' && !s.urgent) return false;
    if (filter === 'ok' && s.pending) return false;
    return !q || fold(a.name + ' ' + a.type + ' ' + a.tag).includes(q);
  });
  if (filter === 'todo' || filter === 'urgent') list.sort((x, y) => (y.s.urgent - x.s.urgent) || (y.s.pending - x.s.pending));
  $('#listLabel').textContent = {all:'Tous les appartements', todo:'Avec des tâches', urgent:'Avec de l’urgent', ok:'À jour'}[filter] + ` · ${list.length}`;

  $('#aptGrid').innerHTML = list.length ? list.map(({a, s}) => {
    const badge = s.urgent ? `<span class="glass urg">${ic('alert')}${s.pending}<span class="sr"> tâches, dont ${s.urgent} urgentes</span></span>`
      : s.pending ? `<span class="glass todo">${s.pending} à faire</span>`
      : `<span class="glass ok">${ic('check')}À jour</span>`;
    return `<a class="card" href="#${a.id}">
      <img src="img/${a.id}.jpg" alt="" width="210" height="210" loading="lazy">
      <span class="card-top"><span class="glass">${a.type}</span>${badge}</span>
      <span class="card-b"><span class="card-t" style="display:block">${esc(a.name)}</span><span class="card-s" style="display:block">${esc(a.tag)}</span></span>
    </a>`;
  }).join('') : `<div class="empty" style="grid-column:1/-1"><strong>Aucun appartement</strong>${q ? 'Aucun nom ne correspond à votre recherche.' : 'Rien dans ce filtre pour le moment.'}</div>`;

  $('#modeNote').innerHTML = ({
    local: 'Données enregistrées sur cet appareil.',
    connecting: 'Synchronisation en cours…',
    synced: `${ic('cloud')}Synchronisé sur tous vos appareils.`,
    stale: 'Connexion lente : les données affichées peuvent ne pas être à jour.',
  })[syncState];
}

let tab = 'home', pushed = false;
function setTab(t){
  tab = t;
  $('#home').hidden = t !== 'home'; $('#wifi').hidden = t !== 'wifi';
  document.querySelectorAll('.tab').forEach(el => el.dataset.tab === t ? el.setAttribute('aria-current','page') : el.removeAttribute('aria-current'));
}
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  if (byId[id]) {
    const changed = current !== id; current = id; if (changed) showDone = false;
    $('#backLbl').textContent = tab === 'wifi' ? 'Wi-Fi' : 'Appartements';
    renderDetail();
    if (changed) $('#detail').scrollTop = 0;
    $('#detail').classList.add('open'); $('#detail').setAttribute('aria-hidden','false');
    document.body.classList.add('pushed');
    onScroll($('#detail'), $('#detNav'), 150);
  } else {
    setTab(id === 'wifi' ? 'wifi' : 'home');
    current = null; closeSheet(true);
    $('#detail').classList.remove('open'); $('#detail').setAttribute('aria-hidden','true');
    document.body.classList.remove('pushed');
  }
}
function back(){ if (pushed) { pushed = false; history.back(); } else { location.hash = tab === 'wifi' ? 'wifi' : ''; route(); } }

/* ---------- Toast ---------- */
let toastTimer = null, undoFn = null;
function toast(msg, undo){
  $('#toastMsg').textContent = msg; undoFn = undo || null; $('#toastUndo').hidden = !undo;
  $('#toast').classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').classList.remove('on'); undoFn = null; }, undo ? 5000 : 2000);
}
$('#toastUndo').addEventListener('click', () => { const f = undoFn; undoFn = null; $('#toast').classList.remove('on'); f && f(); });

/* ---------- Actions ---------- */
async function addTemplate(kind){
  const a = byId[current];
  const existing = new Set([...tasks.values()].filter(t => t.apt === a.id && !t.done).map(t => t.title));
  const base = Date.now();
  const items = TPL[kind](a).filter(([title]) => !existing.has(title))
    .map(([title, cat], i) => ({id: uid(), apt: a.id, title, cat, urgent:false, due: kind === 'depart' ? todayISO() : '', note:'', done:false, createdAt: base + i}));
  if (!items.length) { toast('Cette checklist est déjà dans la liste.'); return; }
  buzz();
  items.forEach(t => tasks.set(t.id, t)); lsWrite(); renderAll();
  toast(`${plural(items.length, 'tâche')} ajoutée${items.length > 1 ? 's' : ''}`, () => items.forEach(t => delTask(t.id)));
  for (const t of items) await dbSet('tasks', t.id, clean(t));
}
async function clearDone(aptId){
  const gone = [...tasks.values()].filter(t => t.done && (!aptId || t.apt === aptId));
  if (!gone.length) return;
  gone.forEach(t => tasks.delete(t.id)); lsWrite(); renderAll();
  toast(`${plural(gone.length, 'tâche')} effacée${gone.length > 1 ? 's' : ''}`, () => gone.forEach(t => putTask(t)));
  for (const t of gone) await dbDel('tasks', t.id);
}
function copy(text, btn){
  const done = () => { toast('Copié'); buzz(); };
  try {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, btn));
  } catch { fallbackCopy(text, btn); }
}
function fallbackCopy(text, btn){
  const v = btn.parentElement.querySelector('.v');
  if (v) { const r = document.createRange(); r.selectNodeContents(v); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  toast('Copie bloquée : texte sélectionné, copiez-le à la main.');
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act],[data-filter],[data-toggle],[data-edit],[data-tpl],[data-cat],[data-op],[data-wifi],[data-copy],[data-reveal],a.card,a.tab');
  if (!el) return;
  if (el.matches('a.card')) { pushed = true; return; }
  if (el.matches('a.tab')) {
    ev.preventDefault();
    const t = el.dataset.tab;
    if (t === tab) { $('#' + t).scrollTo({top:0, behavior:'smooth'}); return; }
    history.replaceState(null, '', t === 'wifi' ? '#wifi' : location.pathname + location.search); route(); return;
  }
  if (el.dataset.filter) { filter = el.dataset.filter === filter && el.classList.contains('sum-chip') ? 'all' : el.dataset.filter; renderHome(); return; }
  if (el.dataset.toggle) { const t = tasks.get(el.dataset.toggle); if (!t) return; buzz(); putTask({...t, done: !t.done, doneAt: !t.done ? Date.now() : null}); return; }
  if (el.dataset.edit) { const t = tasks.get(el.dataset.edit); t && taskSheet(t); return; }
  if (el.dataset.tpl) { addTemplate(el.dataset.tpl); return; }
  if (el.dataset.wifi) { wifiSheet(el.dataset.wifi); return; }
  if (el.dataset.copy !== undefined) { copy(el.dataset.copy, el); return; }
  if (el.dataset.reveal) { const id = el.dataset.reveal; shown.has(id) ? shown.delete(id) : shown.add(id); renderWifi(); renderDetail(); return; }
  if (el.dataset.cat && editing) { editing.cat = el.dataset.cat; document.querySelectorAll('.cat').forEach(b => b.setAttribute('aria-checked', b.dataset.cat === editing.cat)); return; }
  if (el.dataset.op && editingWifi) { editingWifi.op = editingWifi.op === el.dataset.op ? '' : el.dataset.op; document.querySelectorAll('.op').forEach(b => b.setAttribute('aria-checked', b.dataset.op === editingWifi.op)); return; }
  switch (el.dataset.act) {
    case 'back': back(); break;
    case 'new': if (current) taskSheet(null); break;
    case 'settings': settingsSheet(); break;
    case 'close': closeSheet(); break;
    case 'save': saveTask(); break;
    case 'saveWifi': saveWifi(); break;
    case 'urgent': editing.urgent = !editing.urgent; el.setAttribute('aria-checked', editing.urgent); break;
    case 'delete':
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Confirmer la suppression'; return; }
      { const t = tasks.get(editing.id); closeSheet(); delTask(t.id); toast('Tâche supprimée', () => putTask(t)); }
      break;
    case 'delWifi':
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Confirmer l’effacement'; return; }
      { const apt = editingWifi.apt, old = wifi[apt]; closeSheet(); delete wifi[apt]; lsWrite(); renderAll(); dbDel('wifi', apt); toast('Infos effacées', () => putWifi(apt, old)); }
      break;
    case 'toggleDone': showDone = !showDone; renderDetail(); break;
    case 'clearDone': clearDone(current); break;
    case 'clearAllDone': closeSheet(); clearDone(null); break;
    case 'export': {
      const blob = new Blob([JSON.stringify({app:'BookingAlger', date:new Date().toISOString(), tasks:[...tasks.values()], notes, wifi}, null, 1)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bookingalger-sauvegarde-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('Sauvegarde exportée'); break;
    }
  }
});

document.addEventListener('submit', ev => { ev.preventDefault(); if (ev.target.id === 'taskForm') saveTask(); if (ev.target.id === 'wifiForm') saveWifi(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet();
  if (ev.key === 'Enter' && ev.target.id === 'fTitle') { ev.preventDefault(); saveTask(); }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'q') { query = ev.target.value; renderHome(); }
  if (ev.target.id === 'wq') { wquery = ev.target.value; renderWifi(); }
  if (ev.target.id === 'aptNotes' && current) putNote(current, ev.target.value);
  if (ev.target.id === 'fTitle') $('#fErr').hidden = true;
});
document.addEventListener('change', ev => {
  if (ev.target.id !== 'importFile' || !ev.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (!Array.isArray(d.tasks)) throw 0;
      d.tasks.forEach(t => t && t.id && byId[t.apt] && tasks.set(t.id, t));
      notes = {...notes, ...(d.notes || {})}; wifi = {...wifi, ...(d.wifi || {})};
      lsWrite(); renderAll(); closeSheet(); toast('Sauvegarde importée');
    } catch { toast('Ce fichier n’est pas une sauvegarde BookingAlger.'); }
  };
  r.readAsText(ev.target.files[0]);
});

$('#home').addEventListener('scroll', e => onScroll(e.target, $('#homeNav'), 70), {passive:true});
$('#wifi').addEventListener('scroll', e => onScroll(e.target, $('#wifiNav'), 70), {passive:true});
$('#detail').addEventListener('scroll', e => onScroll(e.target, $('#detNav'), 150), {passive:true});
window.addEventListener('hashchange', route);
let sx = null, sy = 0;
$('#detail').addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX < 24 ? t.clientX : null; sy = t.clientY; }, {passive:true});
$('#detail').addEventListener('touchend', e => { if (sx === null) return; const t = e.changedTouches[0]; if (t.clientX - sx > 80 && Math.abs(t.clientY - sy) < 60) back(); sx = null; }, {passive:true});

/* ---------- Démarrage ---------- */
renderAll(); route(); connect();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(() => { $('#splash').classList.add('out'); setTimeout(() => $('#splash').remove(), 500); }, reduce ? 700 : 1600);
if ('serviceWorker' in navigator && window.top === window && location.protocol === 'https:' && !window.claude) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
