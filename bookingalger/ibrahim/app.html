<title>BookingAlger Ibrahim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,300..900&display=swap">
<style>
/* Layout: Android 17 / Material 3 Expressive on white — large top app bar, 2-column photo cards, segmented list groups, extended FAB, navigation bar with pill indicator. Single light theme by choice (white background requested). */
:root{
  color-scheme:light;
  --surface:#FFFFFF; --s-low:#F6F8FB; --s-c:#EFF3F7; --s-high:#E8EDF2; --s-highest:#E1E7ED;
  --on:#181C20; --on-var:#40484F; --outline:#70787F; --outline-var:#C0C7CE;
  --primary:#00658C; --on-primary:#FFFFFF; --pc:#C6E7FF; --on-pc:#001E2D;
  --secondary:#2A6A3D; --sc:#B9F0C5; --on-sc:#00210D;
  --tc:#FFDDB3; --on-tc:#2A1800; --warn:#7C5800;
  --error:#BA1A1A; --ec:#FFDAD6; --on-ec:#410002;
  --inv:#2D3135; --inv-on:#EEF1F5; --inv-primary:#82CFFF; --scrim:rgba(0,0,0,.32);
  --font:"Roboto Flex",Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --xl:28px; --lg:20px; --md:16px; --sm:12px; --xs:4px;
  --spring:cubic-bezier(.34,1.36,.64,1); --emph:cubic-bezier(.2,0,0,1); --t-push:450ms;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--on);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:.005em}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:12px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Ripple */
.rpl{position:relative;overflow:hidden;isolation:isolate}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);animation:rip .55s var(--emph) forwards;pointer-events:none;z-index:0}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:grid;place-items:center;transition:opacity .4s ease,visibility .4s}
#splash img{width:min(72vw,330px);height:auto;animation:logoIn .8s var(--spring) both}
#splash .bar{position:absolute;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:48px;height:4px;border-radius:2px;background:var(--pc);overflow:hidden}
#splash .bar::after{content:"";display:block;height:100%;width:45%;background:var(--primary);border-radius:2px;animation:load 1s var(--emph) infinite}
#splash.out{opacity:0;visibility:hidden}
@keyframes logoIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(230%)}}

/* Views */
.view{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;background:var(--surface)}
.tabview{transition:opacity .25s,transform .3s var(--emph)}
body.pushed .tabview{opacity:0;transform:translateX(-12%)}
#detail{transform:translateX(100%);opacity:.6;transition:transform var(--t-push) var(--emph),opacity .3s;z-index:30;visibility:hidden}
#detail.open{transform:none;opacity:1;visibility:visible}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

/* Top app bar */
.nav{position:sticky;top:0;z-index:4;padding-top:env(safe-area-inset-top,0px);background:var(--surface);transition:background .25s}
.nav.solid{background:var(--s-c)}
/* Accueil et Wi-Fi : pas de barre vide en haut, elle n'apparaît qu'au défilement */
#homeNav,#wifiNav{position:fixed;left:0;right:0;transform:translateY(-110%);transition:transform .3s var(--emph),background .25s;box-shadow:0 1px 0 var(--s-highest)}
#homeNav.solid,#wifiNav.solid{transform:none}
.tabview .wrap{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.nav-in{max-width:760px;margin:0 auto;height:64px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav-title{font-size:20px;font-weight:700;font-variation-settings:"wdth" 115;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:12px}
.nav.solid .nav-title,#detNav .nav-title{opacity:1}
#detNav .nav-title{padding-left:4px}
.nav-r{display:flex;gap:4px}
.nbtn{min-width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--on-var);border-radius:24px}
.nbtn .ic{width:24px;height:24px}

/* Large title */
.large{padding-block:4px 16px}
.brandline img{height:46px;width:auto;max-width:100%;display:block;margin:0 0 16px}
.large h1{font-size:38px;line-height:1;font-weight:800;font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.005em;margin:0;text-wrap:balance}
.sub{color:var(--on-var);font-size:15px;margin:10px 0 0;font-weight:500}

/* Summary — tonal hero card */
.summary{position:relative;overflow:hidden;border-radius:32px;padding:22px 20px 18px;background:linear-gradient(140deg,#00739F 0%,#00577A 55%,#1F5F36 130%);color:#fff;box-shadow:0 12px 32px -12px rgba(0,87,122,.55)}
.summary::before{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;background:#FFFFFF;opacity:.1;clip-path:polygon(50% 0%,61% 12%,77% 8%,82% 24%,97% 30%,92% 46%,100% 59%,87% 69%,88% 86%,71% 87%,61% 100%,50% 91%,39% 100%,29% 87%,12% 86%,13% 69%,0% 59%,8% 46%,3% 30%,18% 24%,23% 8%,39% 12%);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sum-k{position:relative;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.sum-n{position:relative;font-size:56px;line-height:1.05;font-weight:700;font-variation-settings:"wdth" 120;margin-top:6px;font-variant-numeric:tabular-nums}
.sum-n small{font-size:18px;font-weight:500;font-variation-settings:"wdth" 100;margin-left:8px}
.sum-row{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sum-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);font-size:14px;font-weight:600}
.sum-chip .ic{width:18px;height:18px;stroke-width:2.4}
.sum-chip.red{background:#fff;color:var(--error);box-shadow:none}

/* Search bar */
.search{display:flex;align-items:center;gap:12px;height:56px;border-radius:28px;background:var(--s-c);box-shadow:inset 0 0 0 1px var(--s-highest);padding:0 18px;color:var(--on-var);margin-top:16px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--on);font-size:16px;height:100%}
.search input::placeholder{color:var(--on-var)}
.search .ic{width:22px;height:22px}
/* Filter chips */
.chips{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;margin:14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:2px max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 16px;border-radius:8px;background:var(--s-c);color:var(--on);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,border-radius .35s var(--spring)}
.chip:first-child{border-radius:22px 8px 8px 22px}.chip:last-child{border-radius:8px 22px 22px 8px}
.chip .ic{width:18px;height:18px;stroke-width:2.4}
.chip .n{font-variant-numeric:tabular-nums;opacity:.8}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);padding-left:12px;border-radius:22px}

/* Apartment cards */
.sec-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--on-var);margin:28px 4px 12px;min-height:24px}
.sec-h label{letter-spacing:inherit}
.sec-h button{color:var(--primary);font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;min-height:40px;padding:0 12px;border-radius:20px;margin:-8px -8px -8px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
.card{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:30px;overflow:hidden;display:block;background:var(--s-high);transition:border-radius .35s var(--spring),transform .35s var(--spring);isolation:isolate}
.card:active{border-radius:44px;transform:scale(.97)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,0) 35%)}
.card-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.glass{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:14px;font-size:12px;font-weight:700;background:rgba(255,255,255,.94);color:var(--on);font-variant-numeric:tabular-nums;white-space:nowrap}
.glass .ic{width:14px;height:14px;stroke-width:2.8}
.glass.ok{background:var(--sc);color:var(--on-sc)}
.glass.todo{background:var(--pc);color:var(--on-pc)}
.glass.urg{background:var(--error);color:#fff}
.card-b{position:absolute;left:7px;right:7px;bottom:7px;color:var(--on);background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);border-radius:23px;padding:9px 12px 10px}
.card-t{font-size:16px;line-height:1.2;font-weight:750;font-variation-settings:"wdth" 108;overflow-wrap:anywhere}
.card-s{font-size:12px;color:var(--on-var);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 20px;text-align:center;color:var(--on-var);font-size:15px;background:var(--s-c);border-radius:var(--lg)}
.empty strong{display:block;color:var(--on);font-size:17px;font-weight:600;margin-bottom:4px}
.foot{color:var(--on-var);font-size:13px;margin:18px 4px 0;display:flex;align-items:center;gap:6px}
.foot .ic{width:16px;height:16px}

/* Navigation bar */
.tabbar{position:fixed;left:max(24px,env(safe-area-inset-left,0px));right:max(24px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;margin:0 auto;max-width:380px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-radius:36px;box-shadow:0 10px 30px -6px rgba(0,40,60,.25),inset 0 0 0 1px rgba(0,40,60,.06)}
.tabbar-in{display:grid;grid-template-columns:1fr 1fr;height:68px;padding:6px;gap:6px}
.tab{position:relative;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;color:var(--on-var);border-radius:30px}
.tab::before{content:"";position:absolute;inset:0;border-radius:30px;background:var(--primary);transform:scaleX(.3);opacity:0;transition:transform .4s var(--spring),opacity .2s;z-index:-1}
.tab{isolation:isolate}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--on-primary)}
.tab[aria-current="page"]::before{transform:none;opacity:1}
.tab[aria-current="page"] .ic{color:var(--on-primary)}

/* Detail hero */
.banner{position:relative;overflow:hidden;margin:4px max(16px,env(safe-area-inset-left,0px)) 0;border-radius:32px;padding:28px 16px 24px;text-align:center;color:#fff;isolation:isolate;max-width:728px}
@media (min-width:760px){.banner{margin-inline:auto}}
.banner .bg{position:absolute;inset:-40px;z-index:-2;background-size:cover;background-position:center;filter:blur(26px) saturate(150%);transform:scale(1.1)}
.banner::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(0,30,45,.42)}
.banner img{width:128px;height:128px;object-fit:cover;border-radius:36px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.banner h1{font-size:30px;line-height:1.1;font-weight:800;font-variation-settings:"wdth" 125;text-transform:uppercase;margin:16px 0 0;text-wrap:balance}
.banner p{margin:6px 0 0;font-size:15px;opacity:.92}
.banner .glass{vertical-align:1px;margin-right:6px;height:24px;font-size:11px}
.sheet-top{padding-top:16px}

.prog{background:var(--s-c);border-radius:var(--lg);padding:16px;display:flex;align-items:center;gap:16px}
.ring{width:56px;height:56px;flex:none;position:relative}
.ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:var(--s-highest)}.ring .va{stroke:var(--secondary);stroke-linecap:round;transition:stroke-dashoffset .7s var(--spring)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.prog b{display:block;font-size:20px;font-weight:600}
.prog small{color:var(--on-var);font-size:14px}

.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.act{background:var(--s-c);border-radius:var(--lg);min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;padding:8px 4px;text-align:center;transition:border-radius .35s var(--spring)}
.act .ic{color:var(--primary)}
.act:active{border-radius:34px}
.act.primary{background:var(--primary);color:var(--on-primary)}
.act.primary .ic{color:var(--on-primary)}

/* Segmented list groups (Material 3 Expressive) */
.group{display:flex;flex-direction:column;gap:2px}
.group>*{background:var(--s-c);border-radius:var(--xs)}
.group>:first-child{border-top-left-radius:var(--lg);border-top-right-radius:var(--lg)}
.group>:last-child{border-bottom-left-radius:var(--lg);border-bottom-right-radius:var(--lg)}
.task{display:flex;align-items:flex-start;gap:2px;min-height:56px;transition:background .2s}
.task.done{background:var(--s-low)}
.chk{width:56px;min-height:56px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:28px}
.chk span{width:20px;height:20px;border-radius:4px;border:2px solid var(--on-var);display:grid;place-items:center;transition:background .2s,border-color .2s,border-radius .3s var(--spring)}
.chk span .ic{width:16px;height:16px;stroke-width:3.2;color:#fff;opacity:0;transform:scale(.3);transition:opacity .15s,transform .35s var(--spring)}
.chk[aria-checked="true"] span{background:var(--secondary);border-color:var(--secondary);border-radius:6px}
.chk[aria-checked="true"] span .ic{opacity:1;transform:none}
.task-b{flex:1;min-width:0;text-align:left;padding:15px 16px 13px 0;display:block;border-radius:0 var(--xs) var(--xs) 0}
.task-t{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.task.done .task-t{color:var(--outline);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-size:13px;color:var(--on-var);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px;min-width:0}
.meta .ic{width:15px;height:15px}
.meta .urg{color:var(--error);font-weight:700}
.meta .late{color:var(--error)}.meta .soon{color:var(--warn)}
.note-prev{display:-webkit-box!important;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

.notes{width:100%;min-height:120px;border:0;background:var(--s-c);border-radius:var(--lg);padding:16px;font-size:16px;line-height:1.5;resize:vertical;outline:none;box-shadow:inset 0 -2px 0 transparent;transition:box-shadow .2s}
.notes:focus{box-shadow:inset 0 0 0 2px var(--primary)}

/* Wi-Fi */
.wcard{display:flex;flex-direction:column;gap:2px}
.wcard>*{background:var(--s-c);border-radius:var(--xs)}
.wcard>:first-child{border-top-left-radius:var(--lg);border-top-right-radius:var(--lg)}
.wcard>:last-child{border-bottom-left-radius:var(--lg);border-bottom-right-radius:var(--lg)}
.wcard+.wcard{margin-top:14px}
.wh{display:flex;align-items:center;gap:14px;padding:12px 8px 12px 12px}
.wh img{width:48px;height:48px;border-radius:14px;object-fit:cover;flex:none}
.wh-t{flex:1;min-width:0}
.wh-t b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh-t small{color:var(--on-var);font-size:13px}
.edit-btn{min-height:40px;padding:0 16px;color:var(--primary);font-size:14px;font-weight:600;border-radius:20px;box-shadow:inset 0 0 0 1px var(--outline-var)}
.wl{display:flex;align-items:center;gap:8px;min-height:56px;padding:0 4px 0 16px}
.wl .k{width:100px;flex:none;color:var(--on-var);font-size:13px;font-weight:500}
.wl .v{flex:1;min-width:0;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text;padding-block:8px}
.wl .v.mono{font-family:var(--mono);font-size:15px;letter-spacing:.04em}
.icb{width:48px;height:48px;flex:none;display:grid;place-items:center;color:var(--primary);border-radius:24px}
.icb .ic{width:22px;height:22px}
.add-w{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 16px;color:var(--primary);font-size:15px;font-weight:600}
.add-w .ic{width:22px;height:22px}

/* Extended FAB */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--pc);color:var(--on-pc);font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:10px;box-shadow:0 3px 6px rgba(0,0,0,.12),0 6px 16px rgba(0,0,0,.1);transition:border-radius .35s var(--spring),transform .35s var(--spring)}
.fab:active{border-radius:28px;transform:scale(.96)}

/* Bottom sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:40}
#scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:640px;max-height:calc(100% - 48px - env(safe-area-inset-top,0px));background:var(--s-low);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .45s var(--emph);display:flex;flex-direction:column;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{width:32px;height:4px;border-radius:2px;background:var(--outline);opacity:.6;margin:16px auto 4px}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;height:56px}
.sheet-h h2{font-size:22px;font-weight:500;margin:0}
.sheet-h .nbtn{padding:0 14px;color:var(--primary);font-size:14px;font-weight:600;height:40px;min-width:0;border-radius:20px}
.sheet-h .nbtn.strong{justify-self:end;background:var(--primary);color:var(--on-primary);padding:0 20px}
.sheet-b{overflow-y:auto;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.field{background:var(--s-high);border-radius:var(--xs) var(--xs) 0 0;box-shadow:inset 0 -1px 0 var(--on-var);transition:box-shadow .2s}
.field:focus-within{box-shadow:inset 0 -2px 0 var(--primary)}
.field:focus-within label{color:var(--primary)}
.field label{display:block;font-size:12px;font-weight:500;color:var(--on-var);padding:8px 16px 0}
.field input,.field textarea{width:100%;border:0;background:none;outline:none;padding:2px 16px 10px;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.fields{display:flex;flex-direction:column;gap:10px}
.fields .field{border-radius:var(--xs) var(--xs) 0 0}
.lbl{font-size:14px;font-weight:600;color:var(--primary);margin:22px 4px 10px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{min-height:60px;border-radius:var(--md);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:500;color:var(--on-var);box-shadow:inset 0 0 0 1px var(--outline-var);transition:background .2s,border-radius .35s var(--spring)}
.cat .ic{width:22px;height:22px}
.cat[aria-checked="true"]{background:var(--sc);color:var(--on-sc);box-shadow:none;font-weight:700;border-radius:24px}
.ops{display:flex;flex-wrap:wrap;gap:8px}

let wifi = {};           // apt -> {op, line, ssid, pass, note}

let syncState = 'local';
const writing = {};

function lsRead(){ try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch { return {}; } }

(function boot(){ const d = lsRead(); (d.tasks||[]).forEach(t => t && t.id && tasks.set(t.id, t)); notes = d.notes || {}; wifi = d.wifi || {}; })();

function queue(key, fn){ const p = (writing[key] || Promise.resolve()).then(fn, fn); writing[key] = p.catch(()=>{}); return p; }
function clean(o){ const r = {}; for (const k in o) if (k !== 'id' && o[k] !== undefined) r[k] = o[k]; return r; }
const dbSet = (col, id, data) => db ? queue(col+id, () => db.collection(col).doc(id).set(data)).catch(fail) : null;
const dbDel = (col, id) => db ? queue(col+id, () => db.collection(col).doc(id).delete()).catch(fail) : null;

function putTask(t){ tasks.set(t.id, t); lsWrite(); renderAll(); return dbSet('tasks', t.id, clean(t)); }

    tasks = new Map(snap.docs.map(d => [d.id, {id:d.id, ...d.data()}]));

  db.collection('notes').onSnapshot(snap => {
    const n = {}; snap.docs.forEach(d => n[d.id] = (d.data()||{}).text || '');
    notes = n; if (!(document.activeElement && document.activeElement.id === 'aptNotes')) renderDetail();
  }, () => {});
  // Reprend ce qui a été saisi sur cet appareil avant la synchronisation
  const lt = local.tasks || [], ln = local.notes || {}, lw = local.wifi || {};
  if (lt.length || Object.keys(ln).length || Object.keys(lw).length) {
    for (const t of lt) if (t && t.id) await dbSet('tasks', t.id, clean(t));
    for (const [k,v] of Object.entries(ln)) if (v) await dbSet('notes', k, {text:v});
    for (const [k,v] of Object.entries(lw)) if (v) await dbSet('vidanges', k, v);
    try { localStorage.removeItem(LS); } catch {}
  }
}

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,20);
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const dayDiff = iso => Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 864e5);
const fold = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function dueLabel(iso){
  const n = dayDiff(iso);
  if (n === 0) return 'Aujourd’hui'; if (n === 1) return 'Demain'; if (n === -1) return 'Hier';
  return new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
}
const isUrgent = t => !t.done && (t.urgent || (t.due && dayDiff(t.due) < 0));
const sortTasks = (a, b) => (isUrgent(b) - isUrgent(a)) || ((a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : 0) || ((a.createdAt||0) - (b.createdAt||0));
function stats(aptId){
  let pending = 0, urgent = 0, done = 0;
  for (const t of tasks.values()) if (t.apt === aptId) { if (t.done) done++; else { pending++; if (isUrgent(t)) urgent++; } }
  return {pending, urgent, done};
}
const price = n => Number(n).toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g,' ');
const plural = (n, s, p) => `${n} ${n > 1 ? (p || s + 's') : s}`;
const fmtLine = s => { const d = String(s||'').replace(/\s+/g,''); return /^\d{10}$/.test(d) ? d.replace(/(\d{4})(\d{2})(\d{2})(\d{2})/, '$1 $2 $3 $4') : String(s||''); };
function buzz(){ try { navigator.vibrate && navigator.vibrate(8); } catch {} }

const FILTERS = [['all','Tous'],['todo','À faire'],['urgent','Urgent'],['ok','À jour']];

    </a>`;

/* ---------- Onglet Vidanges ---------- */
let wquery = '';
const shown = new Set();
const INTERVALS = ['5000','7500','10000','15000'];
const num = v => { const n = parseInt(String(v ?? '').replace(/\D/g,''), 10); return isNaN(n) ? '' : n; };
const fmtKm = n => Number(n).toLocaleString('fr-FR').replace(/[  ]/g,' ') + ' km';
const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
const monthsSince = iso => { const d = new Date(iso + 'T00:00:00'), n = new Date(); return (n.getFullYear()-d.getFullYear())*12 + n.getMonth()-d.getMonth() - (n.getDate() < d.getDate() ? 1 : 0); };
const hasWifi = w => !!(w && (w.km || w.lastKm || w.lastDate));
function vidStatus(id){
  const w = wifi[id];
  if (!w || (!w.lastKm && !w.lastDate)) return {level:-1, label:'À renseigner', cls:'todo'};
  const next = w.lastKm ? Number(w.lastKm) + (Number(w.op) || 10000) : null;
  const rem = next !== null && w.km ? next - Number(w.km) : null;
  const months = w.lastDate ? monthsSince(w.lastDate) : 0;
  if (rem !== null && rem <= 0) return {level:2, next, rem, label:`Dépassée de ${fmtKm(-rem)}`, cls:'urg'};
  if (months >= 6) return {level:2, next, rem, label:`Faite il y a ${months} mois`, cls:'urg'};
  if (rem !== null && rem <= 1000) return {level:1, next, rem, label:`Dans ${fmtKm(rem)}`, cls:'soon'};
  return {level:0, next, rem, label: rem !== null ? `Dans ${fmtKm(rem)}` : 'À jour', cls:'ok'};
}
const vpill = id => { const st = vidStatus(id); return `<span class="vpill ${st.cls}">${st.level === 2 ? ic('alert') : st.level === 0 ? ic('check') : ''}${st.label}</span>`; };
function wifiLines(a, w){
  const st = vidStatus(a.id), r = [];
  if (w.km) r.push(`<div class="wl"><span class="k">Kilométrage</span><span class="v">${fmtKm(w.km)}</span></div>`);
  if (w.lastDate || w.lastKm) r.push(`<div class="wl"><span class="k">Dernière vidange</span><span class="v">${[w.lastDate ? fmtDate(w.lastDate) : '', w.lastKm ? fmtKm(w.lastKm) : ''].filter(Boolean).join(' · ')}</span></div>`);
  if (st.next) r.push(`<div class="wl"><span class="k">Prochaine</span><span class="v"><b>${fmtKm(st.next)}</b> <small style="color:var(--on-var)">(tous les ${fmtKm(Number(w.op) || 10000)})</small></span></div>`);
  if (w.note) r.push(`<div class="wl"><span class="k">Note</span><span class="v" style="font-size:15px;color:var(--on-var)">${esc(w.note)}</span></div>`);
  return r.join('');
}
function vidCard(a, head){
  const w = wifi[a.id] || {}, filled = hasWifi(w);
  return `<div class="wcard">
    ${head ? `<div class="wh"><img src="img/${a.id}.jpg" alt="" width="76" height="48" loading="lazy"><div class="wh-t"><b>${esc(a.name)}</b><small>${a.type} · ${esc(a.tag)}</small></div>${vpill(a.id)}</div>` : ''}
    ${filled ? wifiLines(a, w) : (head ? '' : `<div class="wl"><span class="v" style="color:var(--on-var);font-size:15px">Aucune vidange enregistrée pour cette voiture.</span></div>`)}
    <div class="vact"><button class="vbtn" data-wifi="${a.id}">${ic('gauge')}${filled ? 'Mettre à jour' : 'Renseigner'}</button><button class="vbtn primary" data-vdone="${a.id}">${ic('vidanges')}Vidange faite</button></div>
  </div>`;
}
function renderWifi(){
  const sts = Object.fromEntries(APTS.map(a => [a.id, vidStatus(a.id)]));
  const due = APTS.filter(a => sts[a.id].level >= 1).length, filled = APTS.filter(a => sts[a.id].level !== -1).length;
  $('#wifiSub').textContent = `${due ? plural(due, 'vidange') + ' à prévoir' : 'Aucune vidange urgente'} · ${filled} sur ${APTS.length} renseignées`;
  const q = fold(wquery.trim()), rank = {2:0, 1:1, 0:2, '-1':3};
  const list = APTS.filter(a => !q || fold([a.name, a.type, a.tag].join(' ')).includes(q))
    .sort((x, y) => (rank[sts[x.id].level] - rank[sts[y.id].level]) || ((sts[x.id].rem ?? 1e9) - (sts[y.id].rem ?? 1e9)));
  $('#wifiLabel').textContent = q ? `${list.length} résultat${list.length > 1 ? 's' : ''}` : 'Les plus urgentes en premier';
  $('#wifiList').innerHTML = list.length ? list.map(a => vidCard(a, true)).join('') : `<div class="empty"><strong>Aucun résultat</strong>Essayez un autre nom de voiture.</div>`;
}

/* ---------- Navigation ---------- */
let tab = 'home', pushed = false;
function setTab(t){
  tab = t;
  $('#home').hidden = t !== 'home'; $('#vidanges').hidden = t !== 'vidanges';
  document.querySelectorAll('.tab').forEach(el => el.dataset.tab === t ? el.setAttribute('aria-current','page') : el.removeAttribute('aria-current'));
}
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  if (byId[id]) {
    const changed = current !== id; current = id; if (changed) showDone = false;
    $('#backLbl').textContent = tab === 'vidanges' ? 'Retour aux vidanges' : 'Retour aux voitures';
    renderDetail();
    if (changed) $('#detail').scrollTop = 0;
    $('#detail').classList.add('open'); $('#detail').setAttribute('aria-hidden','false');
    document.body.classList.add('pushed');
    onScroll($('#detail'), $('#detNav'), 8);
  } else {
    setTab(id === 'vidanges' ? 'vidanges' : 'home');
    current = null; closeSheet(true);
    $('#detail').classList.remove('open'); $('#detail').setAttribute('aria-hidden','true');
    document.body.classList.remove('pushed');
  }
}
function back(){ if (pushed) { pushed = false; history.back(); } else { location.hash = tab === 'vidanges' ? 'vidanges' : ''; route(); } }
function onScroll(el, nav, th){ nav.classList.toggle('solid', el.scrollTop > th); }

    </form>`, done ? '#wKm' : '#wKm');
}
function saveWifi(){
  const e = editingWifi; if (!e) return;
  if (!e.op) e.op = '10000';
  const km = num($('#wKm').value), lastKm = num($('#wLastKm').value);
  if (km !== '' && lastKm !== '' && lastKm > km) { const er = $('#vErr'); er.textContent = 'Le kilométrage de la vidange ne peut pas dépasser le kilométrage actuel.'; er.hidden = false; $('#wLastKm').focus(); return; }
  const w = {km, lastKm, lastDate: $('#wLastDate').value || '', op: e.op, note: $('#wNote').value.trim()};
  closeSheet(); putWifi(e.apt, w); buzz(); toast('Vidange enregistrée');
}

function settingsSheet(){
  const nDone = [...tasks.values()].filter(t => t.done).length;
  openSheet(`
    <div class="sheet-h"><span></span><h2 id="sheetTitle">Réglages</h2><button class="nbtn strong" data-act="close">OK</button></div>
    <div class="sheet-b">
      <div class="list-f" style="padding:14px;display:flex;gap:12px;align-items:center">
        <img src="img/mark.png" alt="" width="20" height="36" style="height:36px;width:auto">
        <div><div style="font-weight:600">BookingAlger · ${APTS.length} appartements</div><div style="color:var(--fg-2);font-size:14px">${[...tasks.values()].filter(t=>!t.done).length} tâches à faire · ${nDone} faites</div></div>
      </div>
      <div class="lbl">Tâches</div>
      <div class="list-f"><button class="plain-btn red" data-act="clearAllDone" ${nDone ? '' : 'disabled style="opacity:.4;cursor:default"'}>${ic('trash')}Effacer toutes les tâches faites (${nDone})</button></div>
      ${!db ? `<div class="lbl">Sauvegarde</div>
      <div class="list-f">
        <button class="plain-btn" data-act="export">${ic('down')}Exporter une sauvegarde</button>
        <div class="lrow" style="padding:0"><label class="plain-btn" for="importFile" style="cursor:pointer">${ic('up')}Importer une sauvegarde</label><input type="file" id="importFile" accept="application/json,.json" class="sr"></div>
      </div>
      <p class="hint">Vos données sont enregistrées sur ce téléphone. Exportez une sauvegarde de temps en temps.</p>`
      : `<p class="hint">${ic('cloud')}<span>Tâches, box Wi-Fi et notes sont synchronisées : ouvrez ce lien sur un autre appareil pour retrouver tout.</span></p>`}
    </div>`);
}

/* ---------- Toast ---------- */
let toastTimer = null, undoFn = null;
function toast(msg, undo){
  $('#toastMsg').textContent = msg; undoFn = undo || null; $('#toastUndo').hidden = !undo;
  $('#toast').classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').classList.remove('on'); undoFn = null; }, undo ? 5000 : 2000);
}
$('#toastUndo').addEventListener('click', () => { const f = undoFn; undoFn = null; $('#toast').classList.remove('on'); f && f(); });

/* ---------- Actions ---------- */
async function addTemplate(kind){
  const a = byId[current];
  const existing = new Set([...tasks.values()].filter(t => t.apt === a.id && !t.done).map(t => t.title));
  const base = Date.now();
  const items = TPL[kind](a).filter(([title]) => !existing.has(title))
    .map(([title, cat], i) => ({id: uid(), apt: a.id, title, cat, urgent:false, due: kind === 'depart' ? todayISO() : '', note:'', done:false, createdAt: base + i}));
  if (!items.length) { toast('Cette checklist est déjà dans la liste.'); return; }
  buzz();
  items.forEach(t => tasks.set(t.id, t)); lsWrite(); renderAll();
  toast(`${plural(items.length, 'tâche')} ajoutée${items.length > 1 ? 's' : ''}`, () => items.forEach(t => delTask(t.id)));
  for (const t of items) await dbSet('tasks', t.id, clean(t));
}
async function clearDone(aptId){
  const gone = [...tasks.values()].filter(t => t.done && (!aptId || t.apt === aptId));
  if (!gone.length) return;
  gone.forEach(t => tasks.delete(t.id)); lsWrite(); renderAll();
  toast(`${plural(gone.length, 'tâche')} effacée${gone.length > 1 ? 's' : ''}`, () => gone.forEach(t => putTask(t)));
  for (const t of gone) await dbDel('tasks', t.id);
}
function copy(text, btn){
  const done = () => { toast('Copié'); buzz(); };
  try {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, btn));
  } catch { fallbackCopy(text, btn); }
}
function fallbackCopy(text, btn){
  const v = btn.parentElement.querySelector('.v');
  if (v) { const r = document.createRange(); r.selectNodeContents(v); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  toast('Copie bloquée : texte sélectionné, copiez-le à la main.');
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act],[data-filter],[data-toggle],[data-edit],[data-tpl],[data-cat],[data-op],[data-wifi],[data-vdone],[data-copy],[data-reveal],a.card,a.tab');
  if (!el) return;
  if (el.matches('a.card')) { pushed = true; return; }
  if (el.matches('a.tab')) {
    ev.preventDefault();
    const t = el.dataset.tab;
    if (t === tab) { $('#' + t).scrollTo({top:0, behavior:'smooth'}); return; }
    history.replaceState(null, '', t === 'vidanges' ? '#vidanges' : location.pathname + location.search); route(); return;
  }
  if (el.dataset.filter) { filter = el.dataset.filter === filter && el.classList.contains('sum-chip') ? 'all' : el.dataset.filter; renderHome(); return; }
  if (el.dataset.toggle) { const t = tasks.get(el.dataset.toggle); if (!t) return; buzz(); putTask({...t, done: !t.done, doneAt: !t.done ? Date.now() : null}); return; }
  if (el.dataset.edit) { const t = tasks.get(el.dataset.edit); t && taskSheet(t); return; }
  if (el.dataset.tpl) { addTemplate(el.dataset.tpl); return; }
  if (el.dataset.wifi) { wifiSheet(el.dataset.wifi); return; }
  if (el.dataset.vdone) { wifiSheet(el.dataset.vdone, true); return; }
  if (el.dataset.copy !== undefined) { copy(el.dataset.copy, el); return; }
  if (el.dataset.reveal) { const id = el.dataset.reveal; shown.has(id) ? shown.delete(id) : shown.add(id); renderWifi(); renderDetail(); return; }
  if (el.dataset.cat && editing) { editing.cat = el.dataset.cat; document.querySelectorAll('.cat').forEach(b => b.setAttribute('aria-checked', b.dataset.cat === editing.cat)); return; }
  if (el.dataset.op && editingWifi) { editingWifi.op = editingWifi.op === el.dataset.op ? '' : el.dataset.op; document.querySelectorAll('.op').forEach(b => b.setAttribute('aria-checked', b.dataset.op === editingWifi.op)); return; }
  switch (el.dataset.act) {
    case 'back': back(); break;
    case 'new': if (current) taskSheet(null); break;
    case 'settings': settingsSheet(); break;
    case 'close': closeSheet(); break;
    case 'save': saveTask(); break;
    case 'saveWifi': saveWifi(); break;
    case 'vNow': {
      const km = $('#wKm').value.trim();
      if (!km) { const er = $('#vErr'); er.textContent = 'Indiquez d’abord le kilométrage actuel.'; er.hidden = false; $('#wKm').focus(); break; }
      $('#wLastKm').value = km; $('#wLastDate').value = todayISO(); $('#vErr').hidden = true; buzz(); break;
    }
    case 'urgent': editing.urgent = !editing.urgent; el.setAttribute('aria-checked', editing.urgent); break;
    case 'delete':
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Confirmer la suppression'; return; }
      { const t = tasks.get(editing.id); closeSheet(); delTask(t.id); toast('Tâche supprimée', () => putTask(t)); }
      break;
    case 'delWifi':
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Confirmer l’effacement'; return; }
      { const apt = editingWifi.apt, old = wifi[apt]; closeSheet(); delete wifi[apt]; lsWrite(); renderAll(); dbDel('vidanges', apt); toast('Suivi effacé', () => putWifi(apt, old)); }
      break;
    case 'toggleDone': showDone = !showDone; renderDetail(); break;
    case 'clearDone': clearDone(current); break;
    case 'clearAllDone': closeSheet(); clearDone(null); break;
    case 'export': {
      const blob = new Blob([JSON.stringify({app:'BookingAlger', date:new Date().toISOString(), tasks:[...tasks.values()], notes, wifi}, null, 1)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bookingalger-sauvegarde-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('Sauvegarde exportée'); break;
    }
  }
});

document.addEventListener('submit', ev => { ev.preventDefault(); if (ev.target.id === 'taskForm') saveTask(); if (ev.target.id === 'wifiForm') saveWifi(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet();
  if (ev.key === 'Enter' && ev.target.id === 'fTitle') { ev.preventDefault(); saveTask(); }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'q') { query = ev.target.value; renderHome(); }
  if (ev.target.id === 'wq') { wquery = ev.target.value; renderWifi(); }
  if (ev.target.id === 'aptNotes' && current) putNote(current, ev.target.value);
  if (ev.target.id === 'fTitle') $('#fErr').hidden = true;
});
document.addEventListener('change', ev => {
  if (ev.target.id !== 'importFile' || !ev.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (!Array.isArray(d.tasks)) throw 0;
      d.tasks.forEach(t => t && t.id && byId[t.apt] && tasks.set(t.id, t));
      notes = {...notes, ...(d.notes || {})}; wifi = {...wifi, ...(d.wifi || {})};
      lsWrite(); renderAll(); closeSheet(); toast('Sauvegarde importée');
    } catch { toast('Ce fichier n’est pas une sauvegarde BookingAlger.'); }
  };
  r.readAsText(ev.target.files[0]);
});

$('#home').addEventListener('scroll', e => onScroll(e.target, $('#homeNav'), 70), {passive:true});
$('#vidanges').addEventListener('scroll', e => onScroll(e.target, $('#wifiNav'), 70), {passive:true});
$('#detail').addEventListener('scroll', e => onScroll(e.target, $('#detNav'), 8), {passive:true});
window.addEventListener('hashchange', route);
let sx = null, sy = 0;
$('#detail').addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX < 24 ? t.clientX : null; sy = t.clientY; }, {passive:true});
$('#detail').addEventListener('touchend', e => { if (sx === null) return; const t = e.changedTouches[0]; if (t.clientX - sx > 80 && Math.abs(t.clientY - sy) < 60) back(); sx = null; }, {passive:true});

/* ---------- Effet ripple Material ---------- */
document.addEventListener('pointerdown', ev => {
  const el = ev.target.closest('button,a.card,a.tab,label.plain-btn');
  if (!el || el.disabled) return;
  el.classList.add('rpl');
  const r = el.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2;
  const sp = document.createElement('span'); sp.className = 'rp';
  sp.style.cssText = `width:${s}px;height:${s}px;left:${ev.clientX - r.left - s/2}px;top:${ev.clientY - r.top - s/2}px`;
  el.appendChild(sp); setTimeout(() => sp.remove(), 600);
}, {passive:true});

/* ---------- Démarrage ---------- */
renderAll(); route(); connect();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(() => { $('#splash').classList.add('out'); setTimeout(() => $('#splash').remove(), 500); }, reduce ? 700 : 1600);
if ('serviceWorker' in navigator && window.top === window && location.protocol === 'https:' && !window.claude) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
